---
################################################################################
# Customer-neutral AAP environment inventory example
################################################################################
# Copy this inventory into the private deployment-configuration repository and
# replace every placeholder with an approved value for the target environment.

terraform_environment: sandbox

assume_role_role_arn: >-
  arn:aws:iam::111122223333:role/ire-terraform-role
assume_role_aws_region: us-east-2
assume_role_application_name: ire-terraform
assume_role_expected_account_id: "111122223333"

terraform_backend_bucket: ire-terraform-state-example
terraform_backend_region: us-east-2

# managed  -> consumers read approved Persistent Terraform outputs.
# external -> consumers use the explicit existing-resource references below.
terraform_persistent_contract_source: managed
terraform_external_persistent_resources: {}
