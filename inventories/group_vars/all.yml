---
################################################################################
# IRE AAP Runtime Variables
#
# Environment-specific AWS account, AssumeRole, backend bucket and region values
# must be supplied by the approved AAP inventory / credential configuration.
#
# Do not commit personal account IDs, credentials, backend bucket names, or
# workstation-specific values to this file.
################################################################################

terraform_environment: sandbox

# AWS deployment context.
assume_role_role_arn: ""
assume_role_expected_account_id: ""
assume_role_aws_region: us-east-1
assume_role_application_name: ire-terraform

# Terraform backend.
terraform_backend_bucket: ""
terraform_backend_region: us-east-1
terraform_backend_encrypt: true
terraform_backend_use_lockfile: true

# Persistent resource contract.
# managed  -> consumers read approved Persistent Terraform outputs.
# external -> consumers use explicitly supplied existing-resource references.
terraform_persistent_contract_source: managed
terraform_external_persistent_resources: {}
