---
# GitHub Actions pipeline for the feature -> test -> development -> main workflow.
#
# Blocking validation:
#   - Terraform formatting
#   - Terraform validation of the real IRE lifecycle stacks
#   - Ansible/YAML validation
#
# Checkov remains advisory while findings are being triaged.

name: CI

"on":
  push:
    branches:
      - main
      - development
      - test

  pull_request:
    branches:
      - test
      - development
      - main

permissions:
  contents: read

jobs:
  ##################################################################################################
  # Ansible / YAML
  ##################################################################################################

  ansible-lint:
    name: Ansible / YAML lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible validation tools
        run: |
          python -m pip install --upgrade pip
          pip install \
            ansible-core \
            ansible-lint \
            yamllint

      - name: Install Ansible collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: |
          yamllint \
            collections/ansible_collections/ire_platform/aws \
            playbooks \
            requirements.yml

      - name: Run ansible-lint
        run: |
          ansible-lint \
            collections/ansible_collections/ire_platform/aws \
            playbooks/

      - name: Check Ansible playbook syntax
        run: |
          for playbook in playbooks/*.yml; do
            echo "Validating: ${playbook}"
            ansible-playbook --syntax-check "${playbook}"
          done

  ##################################################################################################
  # Terraform formatting
  ##################################################################################################

  terraform-format:
    name: Terraform format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform/

  ##################################################################################################
  # Terraform lifecycle-stack validation
  ##################################################################################################

  terraform-validate:
    name: Terraform validate - ${{ matrix.stack }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        stack:
          - persistent
          - platform
          - inspection
          - identity
          - remote-access
          - recovery

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Prepare Terraform plugin cache
        run: |
          mkdir -p /tmp/terraform-plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=/tmp/terraform-plugin-cache" >> "$GITHUB_ENV"

      - name: Terraform init
        run: |
          terraform \
            -chdir="terraform/stacks/${{ matrix.stack }}" \
            init \
            -backend=false \
            -input=false

      - name: Terraform validate
        run: |
          terraform \
            -chdir="terraform/stacks/${{ matrix.stack }}" \
            validate

  ##################################################################################################
  # Security
  ##################################################################################################

  security-scan:
    name: Checkov IaC scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
