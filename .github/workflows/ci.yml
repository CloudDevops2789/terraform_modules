---
# GitHub Actions pipeline for the feature -> development -> main workflow.
#
# development:
#   - formatting
#   - Sandbox validation
#   - validation of module-test consumers for changed reusable modules
#
# main:
#   - formatting
#   - Sandbox validation
#   - validation of every Terraform module-test root
#
# Ansible/YAML validation is blocking on both branches.
# Checkov is currently advisory while findings are being triaged.

name: CI

"on":
  push:
    branches:
      - main
      - development

  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  ##################################################################################################
  # Ansible / YAML
  ##################################################################################################

  ansible-lint:
    name: Ansible / YAML lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible validation tools
        run: |
          python -m pip install --upgrade pip
          pip install \
            ansible-core \
            ansible-lint \
            yamllint

      - name: Install Ansible collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: |
          yamllint \
            collections/ansible_collections/ire_platform/aws \
            playbooks \
            requirements.yml

      - name: Run ansible-lint
        run: |
          ansible-lint \
            collections/ansible_collections/ire_platform/aws \
            playbooks/

      - name: Check Ansible playbook syntax
        run: |
          for playbook in playbooks/*.yml; do
            echo "Validating: ${playbook}"
            ansible-playbook --syntax-check "${playbook}"
          done

  ##################################################################################################
  # Terraform
  ##################################################################################################

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform/

      - name: Prepare Terraform plugin cache
        run: |
          mkdir -p /tmp/terraform-plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=/tmp/terraform-plugin-cache" >> "$GITHUB_ENV"

      - name: Prepare Sandbox validation inputs
        run: |
          echo \
            "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQCtest GitHubActions" \
            > /tmp/dummy.pub

          cat > terraform/environments/sandbox/terraform.tfvars <<'TFVARS'
          public_key_path = "/tmp/dummy.pub"
          TFVARS

      - name: Validate Sandbox
        run: |
          bash scripts/ci/terraform-validate-root.sh \
            terraform/environments/sandbox

      - name: Validate changed Terraform modules
        if: >-
          (github.event_name == 'pull_request' &&
           github.base_ref == 'development') ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/development')
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_REF="$PR_BASE"
            HEAD_REF="$PR_HEAD"
          else
            BASE_REF="$PUSH_BASE"
            HEAD_REF="$PUSH_HEAD"
          fi

          echo "Changed-module validation"
          echo "Base: $BASE_REF"
          echo "Head: $HEAD_REF"

          bash scripts/ci/terraform-validate-changed.sh \
            "$BASE_REF" \
            "$HEAD_REF"

      - name: Validate all Terraform module tests
        if: >-
          (github.event_name == 'pull_request' &&
           github.base_ref == 'main') ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/main')
        run: bash scripts/ci/terraform-validate-all.sh

  ##################################################################################################
  # Security
  ##################################################################################################

  security-scan:
    name: Checkov IaC scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
