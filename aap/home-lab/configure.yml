---
################################################################################
# Home Lab AWX Configuration as Code
#
# Manages only the IRE home-lab AWX objects.
#
# Required shell environment:
#
#   CONTROLLER_HOST
#   CONTROLLER_OAUTH_TOKEN
#
# No controller credentials are stored in Git.
################################################################################

- name: Configure home-lab AWX objects
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/settings.yml
    - vars/job_templates.yml
    - vars/workflows.yml

  vars:
    controller_host_value: >-
      {{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}

    controller_token_value: >-
      {{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}

    controller_validate_certs_value: >-
      {{
        lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL')
        | default('true', true)
        | bool
      }}

  tasks:

    ##########################################################################
    # Preflight
    ##########################################################################

    - name: Validate required AWX connection environment
      ansible.builtin.assert:
        that:
          - controller_host_value | length > 0
          - controller_token_value | length > 0
        fail_msg: >-
          Set CONTROLLER_HOST and CONTROLLER_OAUTH_TOKEN before running
          the home-lab AWX Configuration-as-Code playbook.

    - name: Validate home-lab lifecycle configuration
      ansible.builtin.assert:
        that:
          - awx_organization_name | length > 0
          - awx_inventory_name | length > 0
          - awx_project_name | length > 0
          - awx_project_scm_url | length > 0
          - awx_project_scm_branch | length > 0
          - awx_execution_environment_name | length > 0
          - awx_execution_environment_image | length > 0
          - awx_terraform_credential_name | length > 0
          - awx_managed_ad_password_credential_name | length > 0
          - awx_workload_domain_join_credential_type_name | length > 0

    ##########################################################################
    # SCM Project
    ##########################################################################

    - name: Configure dedicated home-lab AWX Project
      awx.awx.project:
        name: "{{ awx_project_name }}"
        description: >-
          IRE home-lab Terraform and Ansible lifecycle project managed through
          Configuration as Code.
        organization: "{{ awx_organization_name }}"

        scm_type: git
        scm_url: "{{ awx_project_scm_url }}"
        scm_branch: "{{ awx_project_scm_branch }}"
        credential: "{{ awx_project_scm_credential_name }}"
        scm_update_on_launch: "{{ awx_project_update_on_launch }}"

        state: present

        controller_host: "{{ controller_host_value }}"
        controller_oauthtoken: "{{ controller_token_value }}"
        validate_certs: "{{ controller_validate_certs_value }}"

    ##########################################################################
    # Workload Domain Join Credential Type
    #
    # Credential instances remain operational secrets and are not managed in
    # Git. Multiple domain-specific credentials may use this common type.
    ##########################################################################

    - name: Configure workload domain join credential type
      awx.awx.credential_type:
        name: "{{ awx_workload_domain_join_credential_type_name }}"
        description: >-
          Domain credential used by IRE workload bootstrap for Windows and
          Linux Active Directory membership.
        kind: cloud

        inputs:
          fields:
            - id: domain_join_username
              type: string
              label: Domain join username

            - id: domain_join_password
              type: string
              label: Domain join password
              secret: true

          required:
            - domain_join_username
            - domain_join_password

        injectors:
          env:
            IRE_WORKLOAD_DOMAIN_JOIN_USERNAME: >-
              {{ '{{ domain_join_username }}' }}
            IRE_WORKLOAD_DOMAIN_JOIN_PASSWORD: >-
              {{ '{{ domain_join_password }}' }}

        state: present

        controller_host: "{{ controller_host_value }}"
        controller_oauthtoken: "{{ controller_token_value }}"
        validate_certs: "{{ controller_validate_certs_value }}"

    ##########################################################################
    # Execution Environment
    ##########################################################################

    - name: Configure home-lab AWX Execution Environment
      awx.awx.execution_environment:
        name: "{{ awx_execution_environment_name }}"
        image: "{{ awx_execution_environment_image }}"
        pull: always
        state: present

        controller_host: "{{ controller_host_value }}"
        controller_oauthtoken: "{{ controller_token_value }}"
        validate_certs: "{{ controller_validate_certs_value }}"

    ##########################################################################
    # Job Templates
    ##########################################################################

    - name: Configure home-lab AWX Job Templates
      awx.awx.job_template:
        name: "{{ item.name }}"
        organization: "{{ awx_organization_name }}"
        inventory: "{{ awx_inventory_name }}"
        project: "{{ awx_project_name }}"
        playbook: "{{ item.playbook }}"
        execution_environment: "{{ awx_execution_environment_name }}"

        job_type: run
        allow_simultaneous: false

        credentials: "{{ item.credentials | default([]) }}"
        extra_vars: "{{ item.extra_vars | default({}) }}"
        ask_variables_on_launch: >-
          {{ item.ask_variables_on_launch | default(false) }}

        ask_credential_on_launch: >-
          {{ item.ask_credential_on_launch | default(false) }}

        state: present

        controller_host: "{{ controller_host_value }}"
        controller_oauthtoken: "{{ controller_token_value }}"
        validate_certs: "{{ controller_validate_certs_value }}"
      loop: "{{ awx_job_templates }}"
      loop_control:
        label: "{{ item.name }}"

    ##########################################################################
    # Workflow Job Templates
    ##########################################################################

    - name: Configure home-lab AWX Workflow Job Templates
      awx.awx.workflow_job_template:
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        organization: "{{ awx_organization_name }}"
        inventory: "{{ awx_inventory_name }}"

        allow_simultaneous: false
        ask_variables_on_launch: >-
          {{ item.ask_variables_on_launch | default(false) }}

        state: present

        controller_host: "{{ controller_host_value }}"
        controller_oauthtoken: "{{ controller_token_value }}"
        validate_certs: "{{ controller_validate_certs_value }}"
      loop: "{{ awx_workflows }}"
      loop_control:
        label: "{{ item.name }}"

    ##########################################################################
    # Remove obsolete workflow approval nodes
    ##########################################################################

    - name: Remove obsolete home-lab AWX workflow approval nodes
      awx.awx.workflow_job_template_node:
        workflow_job_template: "{{ item.workflow }}"
        identifier: "{{ item.identifier }}"
        organization: "{{ awx_organization_name }}"

        state: absent

        controller_host: "{{ controller_host_value }}"
        controller_oauthtoken: "{{ controller_token_value }}"
        validate_certs: "{{ controller_validate_certs_value }}"
      loop: "{{ awx_workflow_nodes_absent | default([]) }}"
      loop_control:
        label: "{{ item.workflow }} :: {{ item.identifier }}"

    ##########################################################################
    # Workflow Nodes - Pass 1
    ##########################################################################

    - name: Create home-lab AWX workflow nodes
      awx.awx.workflow_job_template_node:
        workflow_job_template: "{{ item.workflow }}"
        identifier: "{{ item.identifier }}"
        organization: "{{ awx_organization_name }}"

        unified_job_template: >-
          {{ item.unified_job_template | default(omit) }}
        approval_node: >-
          {{ item.approval_node | default(omit) }}
        extra_data: >-
          {{ item.extra_data | default(omit) }}

        state: present

        controller_host: "{{ controller_host_value }}"
        controller_oauthtoken: "{{ controller_token_value }}"
        validate_certs: "{{ controller_validate_certs_value }}"
      loop: "{{ awx_workflow_nodes }}"
      loop_control:
        label: "{{ item.workflow }} :: {{ item.identifier }}"

    ##########################################################################
    # Workflow Nodes - Pass 2
    ##########################################################################

    - name: Configure home-lab AWX workflow success relationships
      awx.awx.workflow_job_template_node:
        workflow_job_template: "{{ item.workflow }}"
        identifier: "{{ item.identifier }}"
        organization: "{{ awx_organization_name }}"

        success_nodes: "{{ item.success_nodes | default([]) }}"

        state: present

        controller_host: "{{ controller_host_value }}"
        controller_oauthtoken: "{{ controller_token_value }}"
        validate_certs: "{{ controller_validate_certs_value }}"
      loop: "{{ awx_workflow_nodes }}"
      loop_control:
        label: "{{ item.workflow }} :: {{ item.identifier }}"
