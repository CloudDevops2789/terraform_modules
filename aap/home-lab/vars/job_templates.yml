---
# Home-lab-only AWX Job Templates.
#
# The organization environment uses its own AAP Configuration-as-Code repo.
#

awx_job_templates:

  ##############################################################################
  # Persistent
  ##############################################################################

  - name: "IRE-Persistent-Plan"
    playbook: "playbooks/terraform/plan/persistent.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables:
        client_vpn_pki_kms_key_administrators:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
        client_vpn_pki_kms_key_users:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
    ask_variables_on_launch: false

  - name: "IRE-Persistent-Apply"
    playbook: "playbooks/terraform/apply/persistent.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables:
        client_vpn_pki_kms_key_administrators:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
        client_vpn_pki_kms_key_users:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
    ask_variables_on_launch: false

  - name: "IRE-Persistent-Destroy-Plan"
    playbook: "playbooks/terraform/destroy/persistent.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables:
        client_vpn_pki_kms_key_administrators:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
        client_vpn_pki_kms_key_users:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
    ask_variables_on_launch: false

  - name: "IRE-Persistent-Destroy"
    playbook: "playbooks/terraform/destroy/persistent.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables:
        client_vpn_pki_kms_key_administrators:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
        client_vpn_pki_kms_key_users:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
    ask_variables_on_launch: true

  ##############################################################################
  # Platform
  ##############################################################################

  - name: "IRE-Platform-Plan"
    playbook: "playbooks/terraform/plan/platform.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: false

  - name: "IRE-Platform-Apply"
    playbook: "playbooks/terraform/apply/platform.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: false

  - name: "IRE-Platform-Destroy-Plan"
    playbook: "playbooks/terraform/destroy/platform.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables: {}
    ask_variables_on_launch: false

  - name: "IRE-Platform-Destroy"
    playbook: "playbooks/terraform/destroy/platform.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables: {}
    ask_variables_on_launch: true

  ##############################################################################
  # Inspection
  ##############################################################################

  - name: "IRE-Inspection-Plan"
    playbook: "playbooks/terraform/plan/inspection.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: false

  - name: "IRE-Inspection-Apply"
    playbook: "playbooks/terraform/apply/inspection.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: false

  - name: "IRE-Inspection-Destroy-Plan"
    playbook: "playbooks/terraform/destroy/inspection.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables: {}
    ask_variables_on_launch: false

  - name: "IRE-Inspection-Destroy"
    playbook: "playbooks/terraform/destroy/inspection.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables: {}
    ask_variables_on_launch: true

  ##############################################################################
  # Identity
  ##############################################################################

  - name: "IRE-Identity-Plan"
    playbook: "playbooks/terraform/plan/identity.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
      - "{{ awx_managed_ad_password_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: false

  - name: "IRE-Identity-Apply"
    playbook: "playbooks/terraform/apply/identity.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
      - "{{ awx_managed_ad_password_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: false

  - name: "IRE-Identity-Destroy-Plan"
    playbook: "playbooks/terraform/destroy/identity.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
      - "{{ awx_managed_ad_password_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables: {}
    ask_variables_on_launch: false

  - name: "IRE-Identity-Destroy"
    playbook: "playbooks/terraform/destroy/identity.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
      - "{{ awx_managed_ad_password_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables: {}
    ask_variables_on_launch: true

  ##############################################################################
  # Managed AD bootstrap / cleanup
  ##############################################################################

  - name: "IRE-Managed-AD-Bootstrap"
    playbook: "playbooks/directory/bootstrap.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      directory_environment: "sandbox"
      directory_aws_region: "{{ awx_aws_region }}"
      managed_ad_bootstrap_reset_existing_passwords: false
    ask_variables_on_launch: true

  - name: "IRE-Managed-AD-Unbootstrap"
    playbook: "playbooks/directory/unbootstrap.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      directory_environment: "sandbox"
      directory_aws_region: "{{ awx_aws_region }}"
    ask_variables_on_launch: true

  ##############################################################################
  # Remote Access
  #
  # Current Sandbox mode is mutual certificate authentication.
  # The server certificate is provisioned automatically and passed as a workflow artifact.
  ##############################################################################


  - name: "IRE-Client-VPN-Certificate-Provision"
    playbook: "playbooks/remote-access/provision_client_vpn_certificate.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      client_vpn_certificate_provider: "easyrsa"
      client_vpn_certificate_create: true
      client_vpn_certificate_dns_name: "{{ awx_client_vpn_certificate_dns_name }}"
      client_vpn_certificate_easyrsa_ca_source: "s3"
      client_vpn_certificate_easyrsa_allow_ca_creation: false
    ask_variables_on_launch: true

  - name: "IRE-Remote-Access-Plan"
    playbook: "playbooks/terraform/plan/remote-access.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: true

  - name: "IRE-Remote-Access-Apply"
    playbook: "playbooks/terraform/apply/remote-access.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: true

  - name: "IRE-Remote-Access-Destroy-Plan"
    playbook: "playbooks/terraform/destroy/remote-access.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables: {}
    ask_variables_on_launch: true

  - name: "IRE-Remote-Access-Destroy"
    playbook: "playbooks/terraform/destroy/remote-access.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables: {}
    ask_variables_on_launch: true

  ##############################################################################
  # Recovery
  #
  # demo_ec2_enabled is supplied at lifecycle runtime. This lets the same Job
  # Template support an empty Recovery stack and the full three-node Sandbox
  # recovery exercise without changing the template definition.
  ##############################################################################

  - name: "IRE-Recovery-Plan"
    playbook: "playbooks/terraform/plan/recovery.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: true

  - name: "IRE-Recovery-Apply"
    playbook: "playbooks/terraform/apply/recovery.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: true

  - name: "IRE-Recovery-Destroy-Plan"
    playbook: "playbooks/terraform/destroy/recovery.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables: {}
    ask_variables_on_launch: true

  - name: "IRE-Recovery-Destroy"
    playbook: "playbooks/terraform/destroy/recovery.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
      terraform_variables: {}
    ask_variables_on_launch: true

  ##############################################################################
  # Identity State Contract
  #
  # Read-only helper for workflows that start independently from deployment.
  ##############################################################################

  - name: "IRE-Identity-Contract-Read"
    playbook: "playbooks/directory/read_identity_contract.yml"
    extra_vars:
      managed_ad_group_name: >-
        {{ awx_managed_ad_bootstrap_group_name }}
    credentials:
      - "{{ awx_terraform_credential_name }}"
    ask_variables_on_launch: false

  ##############################################################################
  # Terraform State Refresh
  #
  # Used only to reconcile Terraform remote state after infrastructure was
  # changed or deleted outside Terraform.
  #
  # Refresh Plan is read-only.
  # Refresh Apply updates Terraform state only through a saved -refresh-only
  # plan; it does not recreate or destroy AWS infrastructure.
  ##############################################################################

  - name: "IRE-Recovery-Refresh-Plan"
    playbook: "playbooks/terraform/refresh-plan/recovery.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables:
        demo_ec2_enabled: "{{ awx_recovery_demo_ec2_enabled }}"
    ask_variables_on_launch: true

  - name: "IRE-Recovery-Refresh-Apply"
    playbook: "playbooks/terraform/refresh-apply/recovery.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables:
        demo_ec2_enabled: "{{ awx_recovery_demo_ec2_enabled }}"
    ask_variables_on_launch: true

  - name: "IRE-Remote-Access-Refresh-Plan"
    playbook: "playbooks/terraform/refresh-plan/remote-access.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables:
        client_root_certificate_chain_arn: "{{ awx_client_vpn_client_root_certificate_chain_arn }}"
    ask_variables_on_launch: true

  - name: "IRE-Remote-Access-Refresh-Apply"
    playbook: "playbooks/terraform/refresh-apply/remote-access.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables:
        client_root_certificate_chain_arn: "{{ awx_client_vpn_client_root_certificate_chain_arn }}"
    ask_variables_on_launch: true

  - name: "IRE-Identity-Refresh-Plan"
    playbook: "playbooks/terraform/refresh-plan/identity.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
      - "{{ awx_managed_ad_password_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: true

  - name: "IRE-Identity-Refresh-Apply"
    playbook: "playbooks/terraform/refresh-apply/identity.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
      - "{{ awx_managed_ad_password_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: true

  - name: "IRE-Platform-Refresh-Plan"
    playbook: "playbooks/terraform/refresh-plan/platform.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: true

  - name: "IRE-Platform-Refresh-Apply"
    playbook: "playbooks/terraform/refresh-apply/platform.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables: {}
    ask_variables_on_launch: true

  - name: "IRE-Persistent-Refresh-Plan"
    playbook: "playbooks/terraform/refresh-plan/persistent.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables:
        client_vpn_pki_kms_key_administrators:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
        client_vpn_pki_kms_key_users:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
    ask_variables_on_launch: true

  - name: "IRE-Persistent-Refresh-Apply"
    playbook: "playbooks/terraform/refresh-apply/persistent.yml"
    credentials:
      - "{{ awx_terraform_credential_name }}"
    extra_vars:
      terraform_variables:
        client_vpn_pki_kms_key_administrators:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
        client_vpn_pki_kms_key_users:
          - "{{ awx_client_vpn_pki_kms_principal_arn }}"
    ask_variables_on_launch: true
