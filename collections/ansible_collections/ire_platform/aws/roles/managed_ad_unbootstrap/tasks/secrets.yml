---
################################################################################
# Managed AD Unbootstrap - Secrets
#
# Secrets are scheduled for deletion only after directory cleanup succeeds.
# Immediate force deletion is intentionally unsupported.
################################################################################

- name: Schedule Managed AD user secrets for deletion
  ire_platform.aws.managed_ad_user_secret_cleanup:
    secret_name: "{{ managed_ad_unbootstrap_secret_prefix }}/{{ item }}"
    region: "{{ managed_ad_unbootstrap_region }}"
    recovery_window_days: "{{ managed_ad_unbootstrap_secret_recovery_days }}"
  register: managed_ad_unbootstrap_secret_results
  loop: "{{ managed_ad_unbootstrap_users }}"
  loop_control:
    label: "{{ item }}"

- name: Publish Managed AD secret cleanup facts
  ansible.builtin.set_fact:
    managed_ad_unbootstrap_secrets_scheduled: >-
      {{
        managed_ad_unbootstrap_secret_results.results
        | selectattr('secrets_scheduled', 'defined')
        | map(attribute='secrets_scheduled')
        | flatten
        | list
      }}

    managed_ad_unbootstrap_secrets_already_scheduled: >-
      {{
        managed_ad_unbootstrap_secret_results.results
        | selectattr('secrets_already_scheduled', 'defined')
        | map(attribute='secrets_already_scheduled')
        | flatten
        | list
      }}

    managed_ad_unbootstrap_secrets_missing: >-
      {{
        managed_ad_unbootstrap_secret_results.results
        | selectattr('secrets_missing', 'defined')
        | map(attribute='secrets_missing')
        | flatten
        | list
      }}
