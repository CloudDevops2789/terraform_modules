---
# Teardown path, reached only when s3_bucket_state == 'absent'. `force`
# empties the bucket first (S3 refuses to delete non-empty buckets);
# gated behind s3_bucket_force_destroy so accidental data loss requires two
# deliberate flags. Note: Object-Locked versions still under retention
# cannot be force-deleted - by design.
- name: Destroy S3 bucket
  amazon.aws.s3_bucket:
    name: "{{ s3_bucket_name }}"
    state: absent
    region: "{{ s3_bucket_region }}"
    force: "{{ s3_bucket_force_destroy }}"
    access_key: "{{ s3_bucket_aws_auth.access_key }}"
    secret_key: "{{ s3_bucket_aws_auth.secret_key }}"
    session_token: "{{ s3_bucket_aws_auth.session_token }}"
  register: s3_bucket_destroy_result

- name: Display destroy status
  ansible.builtin.debug:
    msg: "Bucket {{ s3_bucket_name }} removed."
