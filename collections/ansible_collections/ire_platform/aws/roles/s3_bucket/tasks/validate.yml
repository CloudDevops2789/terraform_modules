---
- name: Validate AWS authentication
  ansible.builtin.assert:
    that:
      - s3_bucket_aws_auth is mapping
      - s3_bucket_aws_auth.access_key | default('') | length > 0
      - s3_bucket_aws_auth.secret_key | default('') | length > 0
      - s3_bucket_aws_auth.session_token | default('') | length > 0
    fail_msg: >-
      s3_bucket_aws_auth must contain access_key, secret_key,
      and session_token.

- name: Validate bucket name
  ansible.builtin.assert:
    that:
      - s3_bucket_name | length > 2
      - s3_bucket_name | length <= 63
    fail_msg: "A valid S3 bucket name must be provided."

- name: Validate bucket state
  ansible.builtin.assert:
    that:
      - s3_bucket_state in ['present', 'absent']
    fail_msg: "s3_bucket_state must be either 'present' or 'absent'."

- name: Validate encryption type
  ansible.builtin.assert:
    that:
      - s3_bucket_encryption in ['AES256', 'aws:kms']
    fail_msg: >-
      s3_bucket_encryption must be AES256 or aws:kms.

- name: Validate KMS configuration
  ansible.builtin.assert:
    that:
      - >-
        s3_bucket_encryption != 'aws:kms'
        or s3_bucket_kms_key_id | length > 0
    fail_msg: >-
      s3_bucket_kms_key_id is required when using aws:kms encryption.
