---
# Enabling the lock flag alone protects nothing by default - this default
# retention (mode + days) is what automatically WORM-protects every new
# object version without the writer having to request it per object.
- name: Configure Object Lock default retention
  amazon.aws.s3_bucket:
    name: "{{ s3_bucket_name }}"
    state: present
    region: "{{ s3_bucket_region }}"
    object_lock_enabled: true
    object_lock_default_retention:
      mode: "{{ s3_bucket_object_lock_mode }}"
      days: "{{ s3_bucket_object_lock_retention_days }}"
    access_key: "{{ s3_bucket_aws_auth.access_key }}"
    secret_key: "{{ s3_bucket_aws_auth.secret_key }}"
    session_token: "{{ s3_bucket_aws_auth.session_token }}"
  register: s3_bucket_object_lock_result
