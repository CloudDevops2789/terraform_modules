---
# Temporary AWS credentials supplied by the calling workflow.
# Typically populated from ire_platform.aws.assume_role.
s3_bucket_aws_auth: {}

# S3 bucket configuration.
s3_bucket_name: ""
s3_bucket_region: "us-east-1"
s3_bucket_state: "present"

# Data protection.
s3_bucket_versioning: true

# Object Lock must be configured according to the recovery policy.
s3_bucket_object_lock: true
s3_bucket_object_lock_mode: "GOVERNANCE"
s3_bucket_object_lock_retention_days: 30

# Destructive operations are disabled by default.
s3_bucket_force_destroy: false

# Encryption.
s3_bucket_encryption: "AES256"
s3_bucket_kms_key_id: ""

# Public access protection.
s3_bucket_public_access_block: true

# Default tags. Caller-provided s3_bucket_tags take precedence.
s3_bucket_default_tags:
  ManagedBy: "Ansible"
  Project: "AWS-IRE"

s3_bucket_tags: {}
