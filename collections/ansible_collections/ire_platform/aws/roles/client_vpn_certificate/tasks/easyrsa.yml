---
- name: Validate EasyRSA provider inputs
  ansible.builtin.assert:
    that:
      - client_vpn_certificate_easyrsa_command | length > 0
    fail_msg: >-
      Supply the EasyRSA executable.

- name: Validate filesystem CA source
  ansible.builtin.assert:
    that:
      - client_vpn_certificate_easyrsa_pki_path | length > 0
    fail_msg: >-
      Supply a persistent EasyRSA PKI path when using filesystem storage.
  when:
    - client_vpn_certificate_easyrsa_ca_source == 'filesystem'

- name: Validate EasyRSA CA source
  ansible.builtin.assert:
    that:
      - client_vpn_certificate_easyrsa_ca_source in ['filesystem', 's3']
    fail_msg: >-
      Supply a supported EasyRSA CA storage source.

- name: Validate S3 CA source
  ansible.builtin.assert:
    that:
      - client_vpn_certificate_easyrsa_ca_s3_bucket | length > 0
      - client_vpn_certificate_easyrsa_ca_s3_key | length > 0
      - client_vpn_certificate_easyrsa_ca_kms_key_arn | length > 0
    fail_msg: >-
      Supply S3 bucket, object key, and KMS key ARN when using
      s3.
  when:
    - client_vpn_certificate_easyrsa_ca_source == 's3'

- name: Verify EasyRSA is available
  ansible.builtin.command:
    argv:
      - "{{ client_vpn_certificate_easyrsa_command }}"
      - "--version"
  register: client_vpn_certificate_easyrsa_version
  changed_when: false

- name: Resolve EasyRSA server certificate name
  ansible.builtin.set_fact:
    client_vpn_certificate_easyrsa_effective_server_name: >-
      {{
        client_vpn_certificate_easyrsa_server_name
        if client_vpn_certificate_easyrsa_server_name | length > 0
        else client_vpn_certificate_domain_name
      }}

- name: Set filesystem EasyRSA runtime PKI path
  ansible.builtin.set_fact:
    client_vpn_certificate_easyrsa_runtime_pki_path: "{{ client_vpn_certificate_easyrsa_pki_path }}"
  when:
    - client_vpn_certificate_easyrsa_ca_source == 'filesystem'

- name: Create temporary EasyRSA S3 workspace
  ansible.builtin.tempfile:
    state: directory
    prefix: ire-client-vpn-pki-
  register: client_vpn_certificate_easyrsa_s3_workspace
  when:
    - client_vpn_certificate_easyrsa_ca_source == 's3'

- name: Restrict temporary EasyRSA S3 workspace
  ansible.builtin.file:
    path: "{{ client_vpn_certificate_easyrsa_s3_workspace.path }}"
    state: directory
    mode: "0700"
  when:
    - client_vpn_certificate_easyrsa_ca_source == 's3'

- name: Set S3 EasyRSA runtime PKI path
  ansible.builtin.set_fact:
    client_vpn_certificate_easyrsa_runtime_pki_path: >-
      {{ client_vpn_certificate_easyrsa_s3_workspace.path ~ '/pki' }}
  when:
    - client_vpn_certificate_easyrsa_ca_source == 's3'

- name: Restore EasyRSA PKI archive from S3
  ire_platform.aws.easyrsa_pki_archive:
    action: restore
    bucket: "{{ client_vpn_certificate_easyrsa_ca_s3_bucket }}"
    key: "{{ client_vpn_certificate_easyrsa_ca_s3_key }}"
    pki_path: "{{ client_vpn_certificate_easyrsa_runtime_pki_path }}"
    region: "{{ client_vpn_certificate_region }}"
  register: client_vpn_certificate_easyrsa_s3_restore
  when:
    - client_vpn_certificate_easyrsa_ca_source == 's3'
  no_log: true

- name: Create persistent EasyRSA PKI parent
  ansible.builtin.file:
    path: "{{ client_vpn_certificate_easyrsa_runtime_pki_path | dirname }}"
    state: directory
    mode: "0700"

- name: Check EasyRSA CA certificate
  ansible.builtin.stat:
    path: "{{ client_vpn_certificate_easyrsa_runtime_pki_path }}/ca.crt"
  register: client_vpn_certificate_easyrsa_ca_certificate

- name: Check EasyRSA CA private key
  ansible.builtin.stat:
    path: "{{ client_vpn_certificate_easyrsa_runtime_pki_path }}/private/ca.key"
  register: client_vpn_certificate_easyrsa_ca_private_key
  no_log: true

- name: Validate existing EasyRSA CA state
  ansible.builtin.assert:
    that:
      - >-
        client_vpn_certificate_easyrsa_ca_certificate.stat.exists
        ==
        client_vpn_certificate_easyrsa_ca_private_key.stat.exists
    fail_msg: >-
      EasyRSA PKI is incomplete. The CA certificate and CA private key must
      either both exist or both be absent.
  no_log: true

- name: Require explicit CA creation approval
  ansible.builtin.assert:
    that:
      - client_vpn_certificate_easyrsa_create_ca_if_missing | bool
    fail_msg: >-
      No EasyRSA CA exists at the configured persistent PKI path.
      Set client_vpn_certificate_easyrsa_create_ca_if_missing=true only when
      intentionally creating the environment CA for the first time.
  when:
    - not client_vpn_certificate_easyrsa_ca_certificate.stat.exists

- name: Initialize persistent EasyRSA PKI
  ansible.builtin.command:
    argv:
      - "{{ client_vpn_certificate_easyrsa_command }}"
      - "--batch"
      - "init-pki"
  environment:
    EASYRSA_PKI: "{{ client_vpn_certificate_easyrsa_runtime_pki_path }}"
  register: client_vpn_certificate_easyrsa_init
  changed_when: client_vpn_certificate_easyrsa_init.rc == 0
  when:
    - not client_vpn_certificate_easyrsa_ca_certificate.stat.exists
    - client_vpn_certificate_easyrsa_create_ca_if_missing | bool

- name: Build persistent EasyRSA certificate authority
  ansible.builtin.command:
    argv:
      - "{{ client_vpn_certificate_easyrsa_command }}"
      - "--batch"
      - "--req-cn={{ client_vpn_certificate_easyrsa_common_name }}"
      - "build-ca"
      - "nopass"
  environment:
    EASYRSA_PKI: "{{ client_vpn_certificate_easyrsa_runtime_pki_path }}"
    EASYRSA_ALGO: "rsa"
    EASYRSA_KEY_SIZE: "2048"
  register: client_vpn_certificate_easyrsa_ca
  changed_when: client_vpn_certificate_easyrsa_ca.rc == 0
  no_log: true
  when:
    - not client_vpn_certificate_easyrsa_ca_certificate.stat.exists
    - client_vpn_certificate_easyrsa_create_ca_if_missing | bool

- name: Build EasyRSA Client VPN server certificate
  ansible.builtin.command:
    argv:
      - "{{ client_vpn_certificate_easyrsa_command }}"
      - "--batch"
      - "--san=DNS:{{ client_vpn_certificate_domain_name }}"
      - "build-server-full"
      - "{{ client_vpn_certificate_easyrsa_effective_server_name }}"
      - "nopass"
  environment:
    EASYRSA_PKI: "{{ client_vpn_certificate_easyrsa_runtime_pki_path }}"
    EASYRSA_ALGO: "rsa"
    EASYRSA_KEY_SIZE: "2048"
  register: client_vpn_certificate_easyrsa_server
  changed_when: client_vpn_certificate_easyrsa_server.rc == 0
  no_log: true

- name: Import EasyRSA server certificate into ACM
  ire_platform.aws.client_vpn_certificate_import:
    certificate_path: >-
      {{
        client_vpn_certificate_easyrsa_runtime_pki_path
        ~ '/issued/'
        ~ client_vpn_certificate_easyrsa_effective_server_name
        ~ '.crt'
      }}
    private_key_path: >-
      {{
        client_vpn_certificate_easyrsa_runtime_pki_path
        ~ '/private/'
        ~ client_vpn_certificate_easyrsa_effective_server_name
        ~ '.key'
      }}
    certificate_chain_path: >-
      {{ client_vpn_certificate_easyrsa_runtime_pki_path ~ '/ca.crt' }}
    region: "{{ client_vpn_certificate_region }}"
  register: client_vpn_certificate_easyrsa_import

- name: Publish Client VPN certificate provisioning result
  ansible.builtin.set_fact:
    client_vpn_certificate_provision_result:
      provider: "easyrsa"
      certificate_arn: >-
        {{ client_vpn_certificate_easyrsa_import.certificate_arn }}
      domain_name: >-
        {{ client_vpn_certificate_domain_name }}
      key_algorithm: "RSA-2048"

- name: Remove S3 server private key before persistence
  ansible.builtin.file:
    path: >-
      {{
        client_vpn_certificate_easyrsa_runtime_pki_path
        ~ '/private/'
        ~ client_vpn_certificate_easyrsa_effective_server_name
        ~ '.key'
      }}
    state: absent
  when:
    - client_vpn_certificate_easyrsa_ca_source == 's3'
  no_log: true

- name: Persist EasyRSA PKI archive to S3
  ire_platform.aws.easyrsa_pki_archive:
    action: persist
    bucket: "{{ client_vpn_certificate_easyrsa_ca_s3_bucket }}"
    key: "{{ client_vpn_certificate_easyrsa_ca_s3_key }}"
    pki_path: "{{ client_vpn_certificate_easyrsa_runtime_pki_path }}"
    region: "{{ client_vpn_certificate_region }}"
    kms_key_arn: "{{ client_vpn_certificate_easyrsa_ca_kms_key_arn }}"
  register: client_vpn_certificate_easyrsa_s3_persist
  when:
    - client_vpn_certificate_easyrsa_ca_source == 's3'
  no_log: true

- name: Remove filesystem server private key after import
  ansible.builtin.file:
    path: >-
      {{
        client_vpn_certificate_easyrsa_runtime_pki_path
        ~ '/private/'
        ~ client_vpn_certificate_easyrsa_effective_server_name
        ~ '.key'
      }}
    state: absent
  when:
    - client_vpn_certificate_easyrsa_ca_source == 'filesystem'
    - client_vpn_certificate_easyrsa_cleanup | bool
  no_log: true
