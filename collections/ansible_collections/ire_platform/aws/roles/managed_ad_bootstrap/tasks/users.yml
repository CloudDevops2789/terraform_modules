---
################################################################################
# Managed AD Bootstrap - Users
#
# For each requested SAM account name:
#   1. Check whether the user already exists.
#   2. Record existing versus missing users.
#   3. Create only missing users.
#
# Password management is intentionally handled separately so ordinary reruns do
# not reset existing credentials.
################################################################################

- name: Initialize Managed AD user result lists
  ansible.builtin.set_fact:
    managed_ad_bootstrap_existing_users: []
    managed_ad_bootstrap_new_users: []

- name: Check requested Managed AD users
  ansible.builtin.command:
    argv:
      - aws
      - ds-data
      - describe-user
      - --directory-id
      - "{{ managed_ad_bootstrap_directory_id }}"
      - --sam-account-name
      - "{{ item }}"
      - --region
      - "{{ managed_ad_bootstrap_region }}"
      - --output
      - json
  register: managed_ad_bootstrap_user_lookup_results
  changed_when: false
  failed_when:
    - managed_ad_bootstrap_user_lookup_results.rc != 0
    - >-
      'ResourceNotFoundException'
      not in managed_ad_bootstrap_user_lookup_results.stderr
  loop: "{{ managed_ad_bootstrap_users }}"
  loop_control:
    label: "{{ item }}"

- name: Classify existing Managed AD users
  ansible.builtin.set_fact:
    managed_ad_bootstrap_existing_users: >-
      {{
        managed_ad_bootstrap_existing_users
        + [item.item]
      }}
  when:
    - item.rc == 0
  loop: "{{ managed_ad_bootstrap_user_lookup_results.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Classify missing Managed AD users
  ansible.builtin.set_fact:
    managed_ad_bootstrap_new_users: >-
      {{
        managed_ad_bootstrap_new_users
        + [item.item]
      }}
  when:
    - item.rc != 0
  loop: "{{ managed_ad_bootstrap_user_lookup_results.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create missing Managed AD users
  ansible.builtin.command:
    argv:
      - aws
      - ds-data
      - create-user
      - --directory-id
      - "{{ managed_ad_bootstrap_directory_id }}"
      - --sam-account-name
      - "{{ item }}"
      - --region
      - "{{ managed_ad_bootstrap_region }}"
      - --output
      - json
  register: managed_ad_bootstrap_user_create_results
  changed_when: true
  loop: "{{ managed_ad_bootstrap_new_users }}"
  loop_control:
    label: "{{ item }}"
