---
################################################################################
# Managed AD Bootstrap - Credentials
#
# Credential lifecycle:
#
#   generated
#     New user
#       -> generate unique password through AWS Secrets Manager
#       -> store one Secrets Manager secret
#       -> set Managed AD password
#
#     Existing user
#       -> preserve password and secret
#
#     Existing user + explicit reset request
#       -> generate new unique password
#       -> write a new Secrets Manager secret version
#       -> reset Managed AD password
#
#   vault
#     New user
#       -> read approved password supplied through Ansible Vault
#       -> set Managed AD password
#       -> do not create a Secrets Manager secret
#
#     Existing user
#       -> preserve password
#
#     Existing user + explicit reset request
#       -> read approved password supplied through Ansible Vault
#       -> reset Managed AD password
#
# Password-bearing tasks must remain no_log.
################################################################################

- name: Determine users requiring credential provisioning
  ansible.builtin.set_fact:
    managed_ad_bootstrap_credential_users: >-
      {{
        (
          managed_ad_bootstrap_users
          if managed_ad_bootstrap_reset_existing_passwords
          else managed_ad_bootstrap_new_users
        )
        | unique
        | list
      }}

- name: Validate Vault-backed Managed AD credentials
  ansible.builtin.assert:
    that:
      - managed_ad_bootstrap_user_credentials is mapping
      - item in managed_ad_bootstrap_user_credentials
      - managed_ad_bootstrap_user_credentials[item] is mapping
      - managed_ad_bootstrap_user_credentials[item].password is defined
      - managed_ad_bootstrap_user_credentials[item].password is string
      - managed_ad_bootstrap_user_credentials[item].password | length > 0
    fail_msg: >-
      A Vault-backed password is required for every Managed AD user whose
      credential will be provisioned.
  loop: "{{ managed_ad_bootstrap_credential_users }}"
  loop_control:
    label: "{{ item }}"
  when:
    - managed_ad_bootstrap_user_password_source == "vault"
  no_log: true

- name: Provision generated Managed AD bootstrap credentials
  ire_platform.aws.managed_ad_user_credential:
    directory_id: "{{ managed_ad_bootstrap_directory_id }}"
    user_name: "{{ item }}"
    secret_name: "{{ managed_ad_bootstrap_secret_prefix }}/{{ item }}"
    region: "{{ managed_ad_bootstrap_region }}"
    password_source: generated
    password_length: 24
    store_secret: true
  register: managed_ad_bootstrap_credential_results
  loop: "{{ managed_ad_bootstrap_credential_users }}"
  loop_control:
    label: "{{ item }}"
  when:
    - managed_ad_bootstrap_user_password_source == "generated"
  no_log: true

- name: Provision Vault-backed Managed AD bootstrap credentials
  ire_platform.aws.managed_ad_user_credential:
    directory_id: "{{ managed_ad_bootstrap_directory_id }}"
    user_name: "{{ item }}"
    region: "{{ managed_ad_bootstrap_region }}"
    password_source: supplied
    supplied_password: >-
      {{ managed_ad_bootstrap_user_credentials[item].password }}
    store_secret: false
  register: managed_ad_bootstrap_credential_results
  loop: "{{ managed_ad_bootstrap_credential_users }}"
  loop_control:
    label: "{{ item }}"
  when:
    - managed_ad_bootstrap_user_password_source == "vault"
  no_log: true
