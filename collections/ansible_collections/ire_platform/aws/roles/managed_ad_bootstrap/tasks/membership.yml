---
################################################################################
# Managed AD Bootstrap - Group Membership
#
# Ensures every requested directory user belongs to the requested security
# group. Existing membership is treated as already compliant.
################################################################################

- name: Read Managed AD bootstrap group members
  ansible.builtin.command:
    argv:
      - aws
      - ds-data
      - list-group-members
      - --directory-id
      - "{{ managed_ad_bootstrap_directory_id }}"
      - --sam-account-name
      - "{{ managed_ad_bootstrap_group_name }}"
      - --region
      - "{{ managed_ad_bootstrap_region }}"
      - --output
      - json
  register: managed_ad_bootstrap_group_members_result
  changed_when: false

- name: Parse Managed AD bootstrap group members
  ansible.builtin.set_fact:
    managed_ad_bootstrap_group_members_document: >-
      {{ managed_ad_bootstrap_group_members_result.stdout | from_json }}

- name: Build current Managed AD group member list
  ansible.builtin.set_fact:
    managed_ad_bootstrap_current_group_users: >-
      {{
        managed_ad_bootstrap_group_members_document.Members
        | default([])
        | selectattr('SAMAccountName', 'defined')
        | map(attribute='SAMAccountName')
        | list
      }}

- name: Determine missing Managed AD group memberships
  ansible.builtin.set_fact:
    managed_ad_bootstrap_memberships_to_add: >-
      {{
        managed_ad_bootstrap_users
        | difference(managed_ad_bootstrap_current_group_users)
      }}

- name: Add missing Managed AD users to bootstrap group
  ansible.builtin.command:
    argv:
      - aws
      - ds-data
      - add-group-member
      - --directory-id
      - "{{ managed_ad_bootstrap_directory_id }}"
      - --group-name
      - "{{ managed_ad_bootstrap_group_name }}"
      - --member-name
      - "{{ item }}"
      - --region
      - "{{ managed_ad_bootstrap_region }}"
  register: managed_ad_bootstrap_membership_add_results
  changed_when: true
  loop: "{{ managed_ad_bootstrap_memberships_to_add }}"
  loop_control:
    label: "{{ item }}"
