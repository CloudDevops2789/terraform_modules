---
- name: Resolve private environment variables
  ansible.builtin.set_fact:
    terraform_environment_variables: >-
      {{
        (
          terraform_environment_variables_by_stack
          | default({})
        ).get('common', {})
        | combine(
            (
              terraform_environment_variables_by_stack
              | default({})
            ).get(terraform_stack, {}),
            recursive=true
          )
      }}
  no_log: true

- name: Validate private environment variable keys
  ansible.builtin.assert:
    that:
      - >-
        (
          terraform_environment_variables.keys()
          | list
          | difference(
              terraform_common_environment_variable_allowlist
              + terraform_environment_variable_allowlist
            )
          | length
        ) == 0
      - >-
        (
          terraform_environment_variables.keys()
          | list
          | intersect(terraform_variables.keys() | list)
          | length
        ) == 0
    fail_msg: >-
      Private environment variables contain an unapproved key or overlap
      operator runtime variables.
  no_log: true

- name: Initialize lifecycle dependency outputs
  ansible.builtin.set_fact:
    terraform_dependency_outputs: {}
  no_log: true

- name: Select managed lifecycle dependencies
  ansible.builtin.set_fact:
    terraform_managed_dependencies: >-
      {{
        terraform_dependencies
        | dict2items
        if terraform_persistent_contract_source == 'managed'
        else
        (
          terraform_dependencies
          | dict2items
          | rejectattr('key', 'equalto', 'persistent')
          | list
        )
      }}

- name: Read upstream lifecycle outputs
  ansible.builtin.include_tasks:
    file: "{{ terraform_repository_root }}/playbooks/terraform/tasks/read_dependency.yml"
  loop: "{{ terraform_managed_dependencies }}"
  loop_control:
    loop_var: terraform_dependency
    label: "{{ terraform_dependency.key }}"
  vars:
    terraform_dependency_stack: "{{ terraform_dependency.key }}"
    terraform_dependency_output_names: "{{ terraform_dependency.value }}"
    terraform_dependency_outputs_optional: >-
      {{ terraform_dependency.key == 'persistent' }}

- name: Select effective Persistent Resources
  ansible.builtin.set_fact:
    terraform_effective_persistent_resources: >-
      {{
        terraform_dependency_outputs.persistent
        if terraform_persistent_contract_source == 'managed'
        else terraform_external_persistent_resources
      }}
  when:
    - terraform_stack in ['platform', 'recovery']
  no_log: true

- name: Initialize Terraform contract variables
  ansible.builtin.set_fact:
    terraform_contract_variables: {}
  no_log: true

- name: Build Platform contract inputs
  ansible.builtin.set_fact:
    terraform_contract_variables:
      persistent_resources:
        network_firewall_logging_kms_key_arn: >-
          {{
            terraform_effective_persistent_resources
            .network_firewall_logging_kms_key_arn
            | default(none, true)
          }}
  when:
    - terraform_stack == 'platform'
  no_log: true

- name: Build Identity contract inputs
  ansible.builtin.set_fact:
    terraform_contract_variables:
      platform_contract: >-
        {{ terraform_dependency_outputs.platform.platform_contract }}
  when:
    - terraform_stack == 'identity'
  no_log: true

- name: Build Remote Access contract inputs
  ansible.builtin.set_fact:
    terraform_contract_variables:
      platform_contract: >-
        {{ terraform_dependency_outputs.platform.platform_contract }}
      identity_contract: >-
        {{ terraform_dependency_outputs.identity.identity_contract }}
  when:
    - terraform_stack == 'remote-access'
  no_log: true

- name: Build Recovery contract inputs
  ansible.builtin.set_fact:
    terraform_contract_variables:
      platform_contract: >-
        {{ terraform_dependency_outputs.platform.platform_contract }}
      persistent_resources:
        standard_backup_vault_name: >-
          {{
            terraform_effective_persistent_resources.standard_backup_vault_name
            | default(none, true)
          }}
        air_gapped_backup_vault_arn: >-
          {{
            terraform_effective_persistent_resources.air_gapped_backup_vault_arn
            | default(none, true)
          }}
  when:
    - terraform_stack == 'recovery'
  no_log: true

- name: Prevent runtime override of lifecycle contracts
  ansible.builtin.assert:
    that:
      - >-
        (
          terraform_variables.keys()
          | list
          | intersect(terraform_contract_variables.keys() | list)
          | length
        ) == 0
      - "'managed_ad_password' not in terraform_variables"
    fail_msg: >-
      Terraform lifecycle contracts and credential-owned values cannot be
      overridden through terraform_variables.

- name: Resolve credential-owned Terraform variables
  ansible.builtin.set_fact:
    terraform_sensitive_variables: >-
      {{
        {
          'managed_ad_password':
            lookup(
              'ansible.builtin.env',
              'IRE_TERRAFORM_MANAGED_AD_PASSWORD',
              default=''
            )
        }
        if (
          terraform_stack == 'identity'
          and
          (
            lookup(
              'ansible.builtin.env',
              'IRE_TERRAFORM_MANAGED_AD_PASSWORD',
              default=''
            )
            | length
          ) > 0
        )
        else {}
      }}
  no_log: true

- name: Build effective Terraform runtime variables
  ansible.builtin.set_fact:
    terraform_effective_variables: >-
      {{
        terraform_environment_variables
        | combine(terraform_variables, recursive=true)
        | combine(terraform_contract_variables, recursive=true)
        | combine(terraform_sensitive_variables, recursive=true)
        | combine(dict(aws_region=assume_role_aws_region))
      }}
  no_log: true
