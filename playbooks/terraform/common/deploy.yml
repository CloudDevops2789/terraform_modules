---
- name: Plan or apply Terraform infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    terraform_backend_use_lockfile: true
    terraform_backend_encrypt: true

    terraform_common_environment_variable_allowlist:
      - organization_tags

  pre_tasks:
    - name: Validate Terraform entry-point inputs
      ansible.builtin.assert:
        that:
          - >-
            terraform_operation | default('')
            in ['plan', 'apply', 'refresh-plan', 'refresh-apply']
          - terraform_stack | default('') | length > 0
          - terraform_environment | default('') == 'sandbox'
          - terraform_backend_bucket | default('') | length > 2
          - terraform_backend_region | default('') | length > 0
          - assume_role_role_arn | default('') | length > 0
          - assume_role_aws_region | default('') | length > 0
          - terraform_variables is defined
          - terraform_variables is mapping
        fail_msg: >-
          Terraform entry-point, environment, backend, authentication, or
          runtime-variable inputs are missing or invalid.

    - name: Load stack configuration
      ansible.builtin.include_vars:
        file: "{{ terraform_repository_root }}/playbooks/terraform/config/{{ terraform_stack }}.yml"

    - name: Validate stack configuration
      ansible.builtin.assert:
        that:
          - terraform_var_files is defined
          - terraform_var_files is sequence
          - terraform_environment_variable_allowlist is defined
          - terraform_runtime_variable_allowlist is defined
          - terraform_dependencies is mapping
        fail_msg: >-
          Stack configuration is missing required Terraform lifecycle metadata.

    - name: Validate Persistent Resources source
      ansible.builtin.assert:
        that:
          - >-
            terraform_persistent_contract_source
            | default('')
            in ['managed', 'external']
          - terraform_external_persistent_resources is defined
          - terraform_external_persistent_resources is mapping
          - >-
            terraform_stack != 'persistent'
            or terraform_persistent_contract_source == 'managed'
        fail_msg: >-
          Persistent Resources source must be managed or external. The
          persistent stack itself may run only in managed mode.

    - name: Validate operator runtime variables
      ansible.builtin.assert:
        that:
          - >-
            (
              terraform_variables.keys()
              | list
              | difference(terraform_runtime_variable_allowlist)
              | length
            ) == 0
        fail_msg: >-
          terraform_variables contains values not approved by this stack
          configuration.

    - name: Derive Terraform execution paths
      ansible.builtin.set_fact:
        terraform_effective_root: >-
          {{ terraform_repository_root }}/terraform/stacks/{{ terraform_stack }}
        terraform_effective_environment_config_root: >-
          {{ terraform_repository_root }}/terraform/environments/{{ terraform_environment }}/config
        terraform_effective_backend_key: >-
          ire/{{ terraform_environment }}/{{ terraform_stack }}/terraform.tfstate

    - name: Check Terraform stack root
      ansible.builtin.stat:
        path: "{{ terraform_effective_root }}"
      register: terraform_root_stat

    - name: Validate Terraform stack root
      ansible.builtin.assert:
        that:
          - terraform_root_stat.stat.exists
          - terraform_root_stat.stat.isdir
        fail_msg: >-
          Terraform stack root does not exist: {{ terraform_effective_root }}

    - name: Check required Git-controlled Terraform variable files
      ansible.builtin.stat:
        path: "{{ terraform_effective_environment_config_root }}/{{ item }}"
      loop: "{{ terraform_var_files }}"
      register: terraform_git_var_file_stats

    - name: Validate required Git-controlled Terraform variable files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: >-
          Required Terraform variable file does not exist: {{ item.item }}
      loop: "{{ terraform_git_var_file_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Initialize Terraform variable-file arguments
      ansible.builtin.set_fact:
        terraform_git_var_file_args: []

    - name: Build Terraform variable-file arguments
      ansible.builtin.set_fact:
        terraform_git_var_file_args: >-
          {{
            terraform_git_var_file_args
            +
            [
              '-var-file='
              ~ terraform_effective_environment_config_root
              ~ '/'
              ~ item
            ]
          }}
      loop: "{{ terraform_var_files }}"
      loop_control:
        label: "{{ item }}"

    - name: Report Terraform execution
      ansible.builtin.debug:
        msg:
          - "Operation: {{ terraform_operation }}"
          - "Environment: {{ terraform_environment }}"
          - "Stack: {{ terraform_stack }}"
          - "Backend key: {{ terraform_effective_backend_key }}"
          - "Variable files: {{ terraform_var_files }}"

  roles:
    - role: ire_platform.aws.assume_role

  tasks:
    - name: Create temporary Terraform workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: ire-terraform-
      register: terraform_temp_dir

    - name: Execute Terraform workflow
      block:
        - name: Build Terraform runtime variables
          ansible.builtin.include_tasks:
            file: "{{ terraform_repository_root }}/playbooks/terraform/tasks/runtime_variables.yml"

        - name: Write temporary Terraform runtime variable file
          ansible.builtin.copy:
            content: "{{ terraform_effective_variables | to_nice_json }}"
            dest: "{{ terraform_temp_dir.path }}/terraform.auto.tfvars.json"
            mode: "0600"
          no_log: true

        - name: Initialize Terraform
          ansible.builtin.command:
            argv:
              - terraform
              - init
              - -input=false
              - -reconfigure
              - "-backend-config=bucket={{ terraform_backend_bucket }}"
              - "-backend-config=key={{ terraform_effective_backend_key }}"
              - "-backend-config=region={{ terraform_backend_region }}"
              - "-backend-config=encrypt={{ terraform_backend_encrypt | lower }}"
              - "-backend-config=use_lockfile={{ terraform_backend_use_lockfile | lower }}"
          args:
            chdir: "{{ terraform_effective_root }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
            TF_IN_AUTOMATION: "true"
          changed_when: false
          no_log: true

        - name: Validate Terraform configuration
          ansible.builtin.command:
            argv:
              - terraform
              - validate
          args:
            chdir: "{{ terraform_effective_root }}"
          environment:
            TF_IN_AUTOMATION: "true"
          changed_when: false

        - name: Create Terraform plan
          ansible.builtin.command:
            argv: >-
              {{
                [
                  'terraform',
                  'plan'
                ]
                +
                (
                  ['-refresh-only']
                  if terraform_operation in ['refresh-plan', 'refresh-apply']
                  else []
                )
                +
                [
                  '-no-color',
                  '-input=false',
                  '-lock=true',
                  '-detailed-exitcode'
                ]
                + terraform_git_var_file_args
                + [
                  '-var-file='
                  ~ terraform_temp_dir.path
                  ~ '/terraform.auto.tfvars.json',
                  '-out='
                  ~ terraform_temp_dir.path
                  ~ '/deploy.tfplan'
                ]
              }}
          args:
            chdir: "{{ terraform_effective_root }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
            TF_IN_AUTOMATION: "true"
          register: terraform_plan
          failed_when: terraform_plan.rc not in [0, 2]
          changed_when: terraform_plan.rc == 2

        - name: Display Terraform plan summary
          ansible.builtin.debug:
            msg: >-
              {{
                (
                  terraform_plan.stdout_lines
                  | select('search', '^(Plan:|No changes\\.)')
                  | list
                  | first
                )
                | default('Terraform plan completed successfully.')
              }}

        - name: Guard Identity plan against deletion or replacement
          ansible.builtin.include_tasks:
            file: "{{ terraform_repository_root }}/playbooks/terraform/tasks/guard_identity_plan.yml"
          when:
            - terraform_stack in ['identity', 'identity-poc']
            - terraform_operation == 'apply'
            - terraform_plan.rc == 2

        - name: Apply saved Terraform plan
          ansible.builtin.command:
            argv:
              - terraform
              - apply
              - -input=false
              - "{{ terraform_temp_dir.path }}/deploy.tfplan"
          args:
            chdir: "{{ terraform_effective_root }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
            TF_IN_AUTOMATION: "true"
          when:
            - terraform_operation in ['apply', 'refresh-apply']
            - terraform_plan.rc == 2
          changed_when: true

        ########################################################################
        # Identity Workflow Contract
        #
        # Publish only the small operational contract required by downstream
        # AAP jobs. The reusable directory role never reads Terraform state.
        ########################################################################

        - name: Read Identity contract for downstream workflow jobs
          ansible.builtin.command:
            argv:
              - terraform
              - output
              - -json
              - identity_contract
          args:
            chdir: "{{ terraform_effective_root }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
            TF_IN_AUTOMATION: "true"
          register: terraform_identity_contract_read
          changed_when: false
          when:
            - terraform_stack in ['identity', 'identity-poc']
            - terraform_operation == 'apply'

        - name: Parse Identity workflow contract
          ansible.builtin.set_fact:
            terraform_identity_workflow_contract: >-
              {{ terraform_identity_contract_read.stdout | from_json }}
          when:
            - terraform_stack in ['identity', 'identity-poc']
            - terraform_operation == 'apply'

        - name: Validate enabled Managed AD workflow contract
          ansible.builtin.assert:
            that:
              - >-
                terraform_identity_workflow_contract.directory_id
                | default('')
                | length > 0
              - >-
                terraform_identity_workflow_contract.directory_id
                is match('^d-[0-9a-f]{10}$')
            fail_msg: >-
              Managed AD is enabled but Identity did not expose a valid
              directory ID for downstream directory bootstrap.
          when:
            - terraform_stack in ['identity', 'identity-poc']
            - terraform_operation == 'apply'
            - terraform_identity_workflow_contract.managed_ad_enabled | bool

        - name: Publish Identity workflow artifacts
          ansible.builtin.set_stats:
            data:
              managed_ad_directory_id: >-
                {{ terraform_identity_workflow_contract.directory_id }}
              managed_ad_directory_name: >-
                {{ terraform_identity_workflow_contract.directory_name }}
            per_host: false
          when:
            - terraform_stack in ['identity', 'identity-poc']
            - terraform_operation == 'apply'
            - terraform_identity_workflow_contract.managed_ad_enabled | bool

        - name: Report Terraform result
          ansible.builtin.debug:
            msg: >-
              {% if terraform_plan.rc == 0 %}
              Terraform {{ terraform_environment }}/{{ terraform_stack }}
              is already at the desired state.
              {% elif terraform_operation == 'apply' %}
              Terraform {{ terraform_environment }}/{{ terraform_stack }}
              applied successfully.
              {% else %}
              Terraform {{ terraform_environment }}/{{ terraform_stack }}
              plan completed successfully.
              {% endif %}

      always:
        - name: Remove temporary Terraform workspace
          ansible.builtin.file:
            path: "{{ terraform_temp_dir.path }}"
            state: absent
          when:
            - terraform_temp_dir.path is defined
