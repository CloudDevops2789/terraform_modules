---
################################################################################
# Managed AD Directory Bootstrap
#
# AAP entry point for operational AWS Managed Microsoft AD bootstrap.
#
# AWS access model:
#   AAP credential
#     -> ire_platform.aws.assume_role
#     -> temporary IRE role credentials
#     -> Managed AD / ds-data / Secrets Manager API calls
################################################################################

- name: Bootstrap AWS Managed Microsoft AD users and groups
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:

    - name: Validate directory bootstrap runtime request
      ansible.builtin.assert:
        that:
          - directory_environment | default('') | length > 0
          - directory_aws_region | default('') | length > 0
          - managed_ad_directory_id | default('') is match('^d-[0-9a-f]{10}$')
          - managed_ad_bootstrap_group_name | default('') | length > 0
          - managed_ad_bootstrap_users is defined
          - managed_ad_bootstrap_users is sequence
          - managed_ad_bootstrap_users is not string
          - managed_ad_bootstrap_users | length > 0
          - assume_role_role_arn | default('') | length > 0
          - assume_role_aws_region | default('') | length > 0
        fail_msg: >-
          Supply the directory environment, AWS Region, Managed AD directory
          ID, target group, requested users, and approved AssumeRole inputs
          through AAP runtime variables.

    - name: Derive Managed AD bootstrap environment values
      ansible.builtin.set_fact:
        managed_ad_bootstrap_directory_id: "{{ managed_ad_directory_id }}"
        managed_ad_bootstrap_region: "{{ directory_aws_region }}"
        managed_ad_bootstrap_secret_prefix: >-
          ire/{{ directory_environment }}/ad-users

    - name: Assume IRE AWS deployment role
      ansible.builtin.include_role:
        name: ire_platform.aws.assume_role

  tasks:

    - name: Bootstrap Managed AD users and group
      ansible.builtin.include_role:
        name: ire_platform.aws.managed_ad_bootstrap
        apply:
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"

  post_tasks:

    - name: Validate Managed AD bootstrap workflow result
      ansible.builtin.assert:
        that:
          - managed_ad_bootstrap_group_sid | default('') is match('^S-[0-9-]+$')
        fail_msg: >-
          Managed AD bootstrap completed without a valid authorization-group
          SID for downstream Remote Access.

    - name: Publish Managed AD bootstrap workflow artifacts
      ansible.builtin.set_stats:
        data:
          managed_ad_group_sid: "{{ managed_ad_bootstrap_group_sid }}"
        per_host: false
