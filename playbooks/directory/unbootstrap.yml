---
################################################################################
# Managed AD Directory Unbootstrap
#
# AAP entry point for revoking or fully deprovisioning selected AWS Managed
# Microsoft AD bootstrap users.
#
# AWS access model:
#   AAP credential
#     -> ire_platform.aws.assume_role
#     -> temporary IRE role credentials
#     -> Managed AD / ds-data / Secrets Manager API calls
################################################################################

- name: Unbootstrap AWS Managed Microsoft AD users
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:

    - name: Validate directory unbootstrap runtime request
      ansible.builtin.assert:
        that:
          - directory_environment | default('') | length > 0
          - directory_aws_region | default('') | length > 0
          - managed_ad_directory_id | default('') is match('^d-[0-9a-f]{10}$')
          - managed_ad_unbootstrap_group_name | default('') | length > 0
          - managed_ad_unbootstrap_users is defined
          - managed_ad_unbootstrap_users is sequence
          - managed_ad_unbootstrap_users is not string
          - managed_ad_unbootstrap_users | length > 0
          - assume_role_role_arn | default('') | length > 0
          - assume_role_aws_region | default('') | length > 0
        fail_msg: >-
          Supply the directory environment, AWS Region, Managed AD directory
          ID, target group, explicit user list, and approved AssumeRole inputs
          through AAP runtime variables.

    - name: Derive Managed AD unbootstrap environment values
      ansible.builtin.set_fact:
        managed_ad_unbootstrap_directory_id: "{{ managed_ad_directory_id }}"
        managed_ad_unbootstrap_region: "{{ directory_aws_region }}"
        managed_ad_unbootstrap_secret_prefix: >-
          ire/{{ directory_environment }}/ad-users

    - name: Assume IRE AWS deployment role
      ansible.builtin.include_role:
        name: ire_platform.aws.assume_role

  tasks:

    - name: Unbootstrap Managed AD users
      ansible.builtin.include_role:
        name: ire_platform.aws.managed_ad_unbootstrap
        apply:
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
