---
- name: Bootstrap the Client VPN Managed AD proof identity
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Resolve proof identity user list
      ansible.builtin.set_fact:
        client_vpn_ad_poc_effective_user_names: >-
          {{
            client_vpn_ad_poc_user_names
            | default([client_vpn_ad_poc_user_name])
            | list
          }}

    - name: Validate proof identity inputs
      ansible.builtin.assert:
        that:
          - assume_role_role_arn | default('') | length > 0
          - assume_role_aws_region | default('') | length > 0
          - client_vpn_ad_poc_domain_name | default('') is match('^[A-Za-z0-9.-]+$')
          - client_vpn_ad_poc_effective_user_names | length > 0
          - >-
            client_vpn_ad_poc_effective_user_names
            | map('lower')
            | unique
            | list
            | length
            == client_vpn_ad_poc_effective_user_names | length
          - >-
            client_vpn_ad_poc_effective_user_names
            | select('match', '^[A-Za-z0-9._-]{1,20}$')
            | list
            | length
            == client_vpn_ad_poc_effective_user_names | length
          - client_vpn_ad_poc_group_name | default('') is match('^[A-Za-z0-9._ -]+$')
          - >-
            lookup(
              'ansible.builtin.env',
              'IRE_CLIENT_VPN_TEST_USER_PASSWORD',
              default=''
            ) | length > 0
        fail_msg: >-
          Supply the AssumeRole binding, POC directory DNS name, user name,
          group name, and the approved Client VPN test-user password credential.

  roles:
    - role: ire_platform.aws.assume_role

  tasks:
    - name: Bootstrap proof directory identity
      ire_platform.aws.managed_ad_client_vpn_identities:
        directory_name: "{{ client_vpn_ad_poc_domain_name }}"
        user_names: "{{ client_vpn_ad_poc_effective_user_names }}"
        group_name: "{{ client_vpn_ad_poc_group_name }}"
        temporary_password: >-
          {{
            lookup(
              'ansible.builtin.env',
              'IRE_CLIENT_VPN_TEST_USER_PASSWORD'
            )
          }}
        reset_existing_password: >-
          {{ client_vpn_ad_poc_reset_existing_password | default(false) | bool }}
        region: "{{ assume_role_aws_auth.region }}"
      environment:
        AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
        AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
        AWS_REGION: "{{ assume_role_aws_auth.region }}"
        AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
      register: client_vpn_ad_poc_bootstrap

    - name: Validate proof bootstrap result
      ansible.builtin.assert:
        that:
          - client_vpn_ad_poc_bootstrap.directory_id is match('^d-[0-9a-f]{10}$')
          - client_vpn_ad_poc_bootstrap.group_sid is match('^S-[0-9-]+$')
        fail_msg: Directory bootstrap did not return valid directory and group identifiers.

    - name: Publish proof bootstrap workflow artifacts
      ansible.builtin.set_stats:
        data:
          client_vpn_ad_poc_directory_id: >-
            {{ client_vpn_ad_poc_bootstrap.directory_id }}
          client_vpn_access_group_id: >-
            {{ client_vpn_ad_poc_bootstrap.group_sid }}
        per_host: false

    - name: Report proof bootstrap result
      ansible.builtin.debug:
        msg:
          - "Directory: {{ client_vpn_ad_poc_domain_name }}"
          - "Directory ID: {{ client_vpn_ad_poc_bootstrap.directory_id }}"
          - >-
            Users: {{ client_vpn_ad_poc_effective_user_names | join(', ') }}
          - >-
            Users created: {{ client_vpn_ad_poc_bootstrap.users_created | join(', ') }}
          - >-
            Passwords changed: {{ client_vpn_ad_poc_bootstrap.passwords_changed | join(', ') }}
          - "VPN group: {{ client_vpn_ad_poc_group_name }}"
          - "VPN group SID: {{ client_vpn_ad_poc_bootstrap.group_sid }}"
