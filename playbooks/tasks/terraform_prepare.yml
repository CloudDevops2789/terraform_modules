---
################################################################################
# Terraform Execution Preparation
#
# Prepares the complete runtime variable document used by Terraform.
#
# Sources, in precedence order:
#   1. Approved private environment configuration
#   2. Operator-approved runtime variables
#   3. Upstream lifecycle contracts
#   4. Credential-owned sensitive values
#   5. AWS execution Region
#
# Dependency state is read through terraform_read_dependency.yml.
################################################################################

################################################################################
# Private environment configuration
################################################################################
#
# Stable organization-specific values may come from an approved private AAP
# inventory. They remain separate from operator-supplied terraform_variables
# and credential-owned sensitive values.
################################################################################

- name: Validate private environment variable structure
  ansible.builtin.assert:
    that:
      - terraform_environment_variables_by_stack | default({}) is mapping
      - >-
        (
          terraform_environment_variables_by_stack
          | default({})
        ).get('common', {}) is mapping
      - >-
        (
          terraform_environment_variables_by_stack
          | default({})
        ).get(terraform_stack, {}) is mapping
    fail_msg: >-
      terraform_environment_variables_by_stack must contain optional common
      and stack-specific mappings.
  no_log: true

- name: Resolve approved private environment variables
  ansible.builtin.set_fact:
    terraform_environment_variables: >-
      {{
        (
          terraform_environment_variables_by_stack
          | default({})
        ).get('common', {})
        | combine(
            (
              terraform_environment_variables_by_stack
              | default({})
            ).get(terraform_stack, {}),
            recursive=true
          )
      }}
  no_log: true

- name: Validate approved private environment variable keys
  ansible.builtin.assert:
    that:
      - >-
        (
          terraform_environment_variables.keys()
          | list
          | difference(
              (
                terraform_environment_variable_allowlists.common
                | default([])
              )
              +
              (
                terraform_environment_variable_allowlists[terraform_stack]
                | default([])
              )
            )
          | length
        ) == 0
      - >-
        (
          terraform_environment_variables.keys()
          | list
          | intersect(terraform_variables.keys() | list)
          | length
        ) == 0
      - >-
        (
          terraform_environment_variables.keys()
          | list
          | intersect([
              'aws_region',
              'platform_contract',
              'identity_contract',
              'persistent_resources',
              'managed_ad_password'
            ])
          | length
        ) == 0
    fail_msg: >-
      Private environment variables contain an unapproved key, overlap an
      operator runtime variable, or attempt to replace a contract, Region, or
      credential-owned value.
  no_log: true

################################################################################
# Lifecycle dependencies and contracts
################################################################################
# Managed persistent contracts come from Terraform outputs. External contracts
# come from approved AAP/environment bindings. Downstream Terraform receives the
# same narrow persistent_resources object in both modes.
################################################################################

- name: Initialize Terraform lifecycle contracts
  ansible.builtin.set_fact:
    terraform_dependency_outputs: {}
    terraform_contract_variables: {}
  no_log: true

- name: Validate Persistent Resources contract source
  ansible.builtin.assert:
    that:
      - terraform_persistent_contract_source in ['managed', 'external']
      - terraform_external_persistent_resources is mapping
      - >-
        terraform_stack != 'persistent'
        or terraform_persistent_contract_source == 'managed'
    fail_msg: >-
      terraform_persistent_contract_source must be managed or external.
      The persistent stack itself may run only in managed mode; external mode
      is a consumer contract and never manages external AWS resources.

- name: Select managed lifecycle dependencies
  ansible.builtin.set_fact:
    terraform_managed_dependency_bindings: >-
      {{
        (
          terraform_stack_dependency_outputs[terraform_stack]
          | default({})
          | dict2items
        )
        if terraform_persistent_contract_source == 'managed'
        else
        (
          terraform_stack_dependency_outputs[terraform_stack]
          | default({})
          | dict2items
          | rejectattr('key', 'equalto', 'persistent')
          | list
        )
      }}

- name: Read approved upstream lifecycle outputs
  ansible.builtin.include_tasks:
    file: terraform_read_dependency.yml
  loop: "{{ terraform_managed_dependency_bindings }}"
  loop_control:
    loop_var: terraform_dependency_binding
    label: "{{ terraform_dependency_binding.key }}"
  vars:
    terraform_dependency_outputs_optional: >-
      {{ terraform_dependency_binding.key == 'persistent' }}
    terraform_dependency_stack: "{{ terraform_dependency_binding.key }}"
    terraform_dependency_output_names: "{{ terraform_dependency_binding.value }}"

- name: Select effective Persistent Resources contract
  ansible.builtin.set_fact:
    terraform_effective_persistent_resources: >-
      {{
        terraform_dependency_outputs.persistent
        if terraform_persistent_contract_source == 'managed'
        else terraform_external_persistent_resources
      }}
  when:
    - terraform_stack in ['platform', 'recovery']
  no_log: true

################################################################################
# Persistent Resources -> Platform
################################################################################

- name: Build Platform Persistent Resources contract
  ansible.builtin.set_fact:
    terraform_contract_variables: >-
      {{
        {
          'persistent_resources': {
            'network_firewall_logging_kms_key_arn':
              terraform_effective_persistent_resources.network_firewall_logging_kms_key_arn
              | default(none, true)
          }
        }
      }}
  when:
    - terraform_stack == 'platform'
  no_log: true

################################################################################
# Platform -> Identity
################################################################################

- name: Build Identity Platform contract
  ansible.builtin.set_fact:
    terraform_contract_variables: >-
      {{
        {
          'platform_contract':
            terraform_dependency_outputs.platform.platform_contract
        }
      }}
  when:
    - terraform_stack == 'identity'
  no_log: true

################################################################################
# Platform + Identity -> Remote Access
################################################################################

- name: Build Remote Access lifecycle contracts
  ansible.builtin.set_fact:
    terraform_contract_variables: >-
      {{
        {
          'platform_contract':
            terraform_dependency_outputs.platform.platform_contract,
          'identity_contract':
            terraform_dependency_outputs.identity.identity_contract
        }
      }}
  when:
    - terraform_stack == 'remote-access'
  no_log: true

################################################################################
# Persistent Resources + Platform -> Recovery
################################################################################

- name: Build Recovery lifecycle contracts
  ansible.builtin.set_fact:
    terraform_contract_variables: >-
      {{
        {
          'platform_contract':
            terraform_dependency_outputs.platform.platform_contract,

          'persistent_resources': {
            'standard_backup_vault_name':
              terraform_effective_persistent_resources.standard_backup_vault_name
              | default(none, true),

            'air_gapped_backup_vault_arn':
              terraform_effective_persistent_resources.air_gapped_backup_vault_arn
              | default(none, true)
          }
        }
      }}
  when:
    - terraform_stack == 'recovery'
  no_log: true

- name: Prevent operator override of lifecycle contracts
  ansible.builtin.assert:
    that:
      - >-
        (
          terraform_variables.keys()
          | list
          | intersect(terraform_contract_variables.keys() | list)
          | length
        ) == 0
    fail_msg: >-
      Lifecycle contracts are resolved internally by AAP and cannot be
      supplied or overridden through terraform_variables.

- name: Report resolved lifecycle dependencies
  ansible.builtin.debug:
    msg:
      - "Stack: {{ terraform_stack }}"
      - "Persistent contract source: {{ terraform_persistent_contract_source }}"
      - >-
        Managed dependencies:
        {{
          terraform_managed_dependency_bindings
          | map(attribute='key')
          | list
        }}

################################################################################
# Credential-owned sensitive values
################################################################################
#
# Sensitive Terraform values come only from approved AAP credential injectors.
# They are not accepted through the ordinary operator terraform_variables map.
################################################################################

- name: Initialize Terraform sensitive variable map
  ansible.builtin.set_fact:
    terraform_sensitive_variables: {}
  no_log: true

- name: Prevent operator override of credential-owned Terraform variables
  ansible.builtin.assert:
    that:
      - >-
        (
          terraform_variables.keys()
          | list
          | intersect(terraform_reserved_sensitive_variable_names)
          | length
        ) == 0
    fail_msg: >-
      Credential-owned Terraform variables cannot be supplied through the
      ordinary terraform_variables map.
  vars:
    terraform_reserved_sensitive_variable_names:
      - managed_ad_password

- name: Resolve Managed AD password from the AAP credential environment
  ansible.builtin.set_fact:
    terraform_sensitive_variables: >-
      {{
        {
          'managed_ad_password':
            lookup(
              'ansible.builtin.env',
              'IRE_TERRAFORM_MANAGED_AD_PASSWORD',
              default=''
            )
        }
        if (
          lookup(
            'ansible.builtin.env',
            'IRE_TERRAFORM_MANAGED_AD_PASSWORD',
            default=''
          )
          | length
        ) > 0
        else {}
      }}
  when:
    - terraform_stack == 'identity'
  no_log: true

################################################################################
# Final Terraform runtime variable document
################################################################################

- name: Build effective Terraform runtime variables
  ansible.builtin.set_fact:
    terraform_effective_variables: >-
      {{
        terraform_environment_variables
        | combine(terraform_variables, recursive=true)
        | combine(
            terraform_contract_variables | default({}),
            recursive=true
          )
        | combine(
            terraform_sensitive_variables | default({}),
            recursive=true
          )
        | combine(
            dict(aws_region=assume_role_aws_region)
          )
      }}
  no_log: true
