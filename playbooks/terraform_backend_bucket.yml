---
# Bootstrap the S3 backend required by Terraform before Terraform can
# initialize remote state.
#
# Environment-specific values are supplied by AAP, inventory, or
# --extra-vars rather than being embedded in reusable source code.

- name: Bootstrap Terraform S3 backend
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Validate Terraform backend bootstrap inputs
      ansible.builtin.assert:
        that:
          - assume_role_role_arn | default('') | length > 0
          - assume_role_aws_region | default('') | length > 0
          - s3_bucket_name | default('') | length > 2
          - s3_bucket_region | default('') | length > 0
        fail_msg: >-
          assume_role_role_arn, assume_role_aws_region,
          s3_bucket_name, and s3_bucket_region must be supplied
          by the calling AAP job or operator.

  roles:
    - role: ire_platform.aws.assume_role

    - role: ire_platform.aws.s3_bucket
      vars:
        s3_bucket_aws_auth: "{{ assume_role_aws_auth }}"
