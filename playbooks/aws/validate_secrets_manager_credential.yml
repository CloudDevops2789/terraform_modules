---
- name: Validate AWS Secrets Manager credential access
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_secret_username_key: username
    aws_secret_password_key: password

  pre_tasks:
    - name: Validate Secrets Manager request
      ansible.builtin.assert:
        that:
          - aws_secret_id | default('') | length > 0
          - assume_role_role_arn | default('') | length > 0
          - assume_role_aws_region | default('') | length > 0
        fail_msg: >-
          Supply aws_secret_id and approved AssumeRole runtime inputs.

    - name: Assume IRE AWS deployment role
      ansible.builtin.include_role:
        name: ire_platform.aws.assume_role

  tasks:
    - name: Retrieve credential from AWS Secrets Manager
      block:
        - name: Read requested Secrets Manager secret
          ansible.builtin.set_fact:
            aws_secret_raw: >-
              {{
                lookup(
                  'amazon.aws.secretsmanager_secret',
                  aws_secret_id,
                  region=assume_role_aws_auth.region,
                  access_key=assume_role_aws_auth.access_key,
                  secret_key=assume_role_aws_auth.secret_key,
                  session_token=assume_role_aws_auth.session_token
                )
              }}
          no_log: true

      rescue:
        - name: Report Secrets Manager retrieval failure
          ansible.builtin.fail:
            msg: >-
              Secrets Manager retrieval failed:
              {{
                ansible_failed_result.msg
                | default('No detailed error message was returned')
              }}

    - name: Normalize Secrets Manager credential
      ansible.builtin.set_fact:
        aws_secret_credential: >-
          {{
            aws_secret_raw
            if aws_secret_raw is mapping
            else (aws_secret_raw | from_json)
          }}
      no_log: true

    - name: Validate expected credential fields
      ansible.builtin.assert:
        that:
          - aws_secret_credential is mapping
          - aws_secret_username_key in aws_secret_credential
          - aws_secret_password_key in aws_secret_credential
          - aws_secret_credential[aws_secret_username_key] | string | length > 0
          - aws_secret_credential[aws_secret_password_key] | string | length > 0
        fail_msg: >-
          The secret was retrieved but does not contain the configured username
          and password fields.
      no_log: true

    - name: Report Secrets Manager credential validation
      ansible.builtin.debug:
        msg:
          - "Secrets Manager retrieval successful: true"
          - "Secret ID: {{ aws_secret_id }}"
          - "Region: {{ assume_role_aws_auth.region }}"
          - >-
            Username:
            {{ aws_secret_credential[aws_secret_username_key] }}
          - "Password present: true"
          - "Password value intentionally suppressed from AAP output."
