---
- name: Reveal temporary Client VPN test-user credential
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    client_vpn_test_secret_id: "ire/test/ad-user"
    client_vpn_test_username_key: username
    client_vpn_test_password_key: password

  pre_tasks:
    - name: Validate AWS runtime inputs
      ansible.builtin.assert:
        that:
          - assume_role_role_arn | default('') | length > 0
          - assume_role_aws_region | default('') | length > 0
        fail_msg: >-
          Approved AWS AssumeRole runtime inputs are required.

    - name: Assume IRE AWS deployment role
      ansible.builtin.include_role:
        name: ire_platform.aws.assume_role

  tasks:
    - name: Retrieve temporary Client VPN test-user secret
      block:
        - name: Read Client VPN test-user secret
          ansible.builtin.set_fact:
            client_vpn_test_secret_raw: >-
              {{
                lookup(
                  'amazon.aws.secretsmanager_secret',
                  client_vpn_test_secret_id,
                  region=assume_role_aws_auth.region,
                  access_key=assume_role_aws_auth.access_key,
                  secret_key=assume_role_aws_auth.secret_key,
                  session_token=assume_role_aws_auth.session_token
                )
              }}
          no_log: true

      rescue:
        - name: Report Secrets Manager retrieval failure
          ansible.builtin.fail:
            msg: >-
              Client VPN test-user credential retrieval failed:
              {{
                ansible_failed_result.msg
                | default('No detailed error message was returned')
              }}

    - name: Normalize Client VPN test-user credential
      ansible.builtin.set_fact:
        client_vpn_test_credential: >-
          {{
            client_vpn_test_secret_raw
            if client_vpn_test_secret_raw is mapping
            else (client_vpn_test_secret_raw | from_json)
          }}
      no_log: true

    - name: Validate Client VPN test-user credential
      ansible.builtin.assert:
        that:
          - client_vpn_test_credential is mapping
          - client_vpn_test_username_key in client_vpn_test_credential
          - client_vpn_test_password_key in client_vpn_test_credential
          - >-
            client_vpn_test_credential[client_vpn_test_username_key]
            | string
            | length > 0
          - >-
            client_vpn_test_credential[client_vpn_test_password_key]
            | string
            | length > 0
        fail_msg: >-
          The Client VPN test-user secret does not contain valid username
          and password fields.
      no_log: true

    # TEMPORARY TESTING ONLY.
    # This intentionally reveals the dedicated Client VPN test-user credential
    # in AAP stdout so an authorized tester can authenticate interactively.
    # Remove this playbook/JT after Client VPN authentication testing.
    - name: Display temporary Client VPN test-user credential
      ansible.builtin.debug:
        msg:
          - "TEMPORARY CLIENT VPN TEST CREDENTIAL"
          - "Secret ID: {{ client_vpn_test_secret_id }}"
          - >-
            Username:
            {{ client_vpn_test_credential[client_vpn_test_username_key] }}
          - >-
            Password:
            {{ client_vpn_test_credential[client_vpn_test_password_key] }}
          - "Remove this temporary playbook and Job Template after testing."
