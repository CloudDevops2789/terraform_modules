---
################################################################################
# Workload Domain Bootstrap
#
# Joins explicitly selected Windows or Linux EC2 workloads to an approved
# directory using Ansible over AWS Systems Manager.
#
# Runtime inputs:
#
#   workload_domain_bootstrap_targets:
#     - name: recovery_windows
#       instance_id: i-0123456789abcdef0
#       platform: windows
#
#   workload_domain_bootstrap_ssm_bucket_name: approved-transfer-bucket
#   workload_domain_bootstrap_ssm_sse_mode: AES256
#
# Optional when using AWS KMS:
#
#   workload_domain_bootstrap_ssm_sse_mode: aws:kms
#   workload_domain_bootstrap_ssm_kms_key_arn: arn:aws:kms:REGION:ACCOUNT:key/KEY
#   workload_domain_bootstrap_domain_name: ad.example.com
#
# Domain credentials are supplied at runtime through:
#
#   IRE_WORKLOAD_DOMAIN_JOIN_USERNAME
#   IRE_WORKLOAD_DOMAIN_JOIN_PASSWORD
#
# No SSH or WinRM ingress is required.
################################################################################

- name: Build workload domain bootstrap inventory
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:

    - name: Validate workload bootstrap request
      ansible.builtin.assert:
        that:
          - workload_domain_bootstrap_targets is defined
          - workload_domain_bootstrap_targets is sequence
          - workload_domain_bootstrap_targets is not string
          - workload_domain_bootstrap_targets | length > 0
          - workload_domain_bootstrap_domain_name | default('') | trim | length > 0
          - workload_domain_bootstrap_ssm_bucket_name | default('') | trim | length > 0
          - >-
            (
              workload_domain_bootstrap_ssm_sse_mode
              | default('AES256', true)
            )
            in ['AES256', 'aws:kms']
          - >-
            (
              workload_domain_bootstrap_ssm_sse_mode
              | default('AES256', true)
            ) != 'aws:kms'
            or
            (
              workload_domain_bootstrap_ssm_kms_key_arn
              | default('')
              is match('^arn:[^:]+:kms:[^:]+:[0-9]{12}:key/.+$')
            )
          - assume_role_role_arn | default('') | length > 0
          - assume_role_aws_region | default('') | length > 0
        fail_msg: >-
          Supply one or more workload targets, target domain, approved SSM
          transfer bucket, supported encryption mode, and valid AssumeRole
          configuration. A KMS key ARN is required only for aws:kms.

    - name: Validate workload bootstrap targets
      ansible.builtin.assert:
        that:
          - item is mapping
          - item.instance_id is defined
          - item.instance_id is string
          - item.instance_id is match('^i-[0-9a-fA-F]+$')
          - item.platform is defined
          - item.platform in ['windows', 'linux']
          - >-
            item.name is not defined
            or (
              item.name is string
              and item.name | trim | length > 0
            )
        fail_msg: >-
          Each workload target must define a valid EC2 instance_id and platform
          of windows or linux. name is optional.
      loop: "{{ workload_domain_bootstrap_targets }}"

    - name: Validate unique workload instance IDs
      ansible.builtin.assert:
        that:
          - >-
            workload_domain_bootstrap_targets
            | map(attribute='instance_id')
            | unique
            | length
            ==
            workload_domain_bootstrap_targets
            | length
        fail_msg: >-
          workload_domain_bootstrap_targets contains duplicate EC2 instance IDs.

    - name: Assume IRE AWS deployment role
      ansible.builtin.include_role:
        name: ire_platform.aws.assume_role
      vars:
        assume_role_application_name: "ire-workload-bootstrap"

  tasks:

    - name: Register selected workloads for Systems Manager bootstrap
      ansible.builtin.add_host:
        name: "{{ item.name | default(item.instance_id) }}"

        groups:
          - workload_targets

        ansible_host: "{{ item.instance_id }}"
        ansible_connection: amazon.aws.aws_ssm

        ansible_aws_ssm_instance_id: "{{ item.instance_id }}"
        ansible_aws_ssm_region: "{{ assume_role_aws_auth.region }}"

        ansible_aws_ssm_bucket_name: >-
          {{ workload_domain_bootstrap_ssm_bucket_name }}

        ansible_aws_ssm_bucket_sse_mode: >-
          {{
            workload_domain_bootstrap_ssm_sse_mode
            | default('AES256', true)
          }}

        ansible_aws_ssm_bucket_sse_kms_key_id: >-
          {{ workload_domain_bootstrap_ssm_kms_key_arn | default('') }}

        ansible_aws_ssm_access_key_id: >-
          {{ assume_role_aws_auth.access_key }}

        ansible_aws_ssm_secret_access_key: >-
          {{ assume_role_aws_auth.secret_key }}

        ansible_aws_ssm_session_token: >-
          {{ assume_role_aws_auth.session_token }}

        ansible_shell_type: >-
          {{
            'powershell'
            if item.platform == 'windows'
            else 'sh'
          }}

        workload_domain_bootstrap_requested_platform: "{{ item.platform }}"
        workload_domain_bootstrap_logical_key: >-
          {{ item.name | default(item.instance_id) }}

      loop: "{{ workload_domain_bootstrap_targets }}"
      no_log: true


- name: Bootstrap workload domain membership
  hosts: workload_targets
  gather_facts: true

  pre_tasks:

    - name: Resolve workload domain join credential
      ansible.builtin.set_fact:
        workload_domain_bootstrap_effective_username: >-
          {{
            workload_domain_bootstrap_username
            | default(
                lookup(
                  'ansible.builtin.env',
                  'IRE_WORKLOAD_DOMAIN_JOIN_USERNAME',
                  default=''
                ),
                true
              )
          }}

        workload_domain_bootstrap_effective_password: >-
          {{
            workload_domain_bootstrap_password
            | default(
                lookup(
                  'ansible.builtin.env',
                  'IRE_WORKLOAD_DOMAIN_JOIN_PASSWORD',
                  default=''
                ),
                true
              )
          }}
      no_log: true

    - name: Validate workload bootstrap runtime request
      ansible.builtin.assert:
        that:
          - workload_domain_bootstrap_domain_name | default('') | length > 0
          - workload_domain_bootstrap_effective_username | length > 0
          - workload_domain_bootstrap_effective_password | length > 0
        fail_msg: >-
          Supply the target domain and approved domain-join credential through
          the AAP credential/runtime contract.
      no_log: true

    - name: Validate discovered workload platform
      ansible.builtin.assert:
        that:
          - >-
            (
              workload_domain_bootstrap_requested_platform == 'windows'
              and ansible_os_family == 'Windows'
            )
            or
            (
              workload_domain_bootstrap_requested_platform == 'linux'
              and ansible_os_family == 'RedHat'
            )
        fail_msg: >-
          Recovery workload {{ inventory_hostname }} does not match the
          operating-system platform recorded in the Recovery contract.

  tasks:

    - name: Bootstrap workload directory membership
      ansible.builtin.include_role:
        name: ire_platform.aws.workload_domain_bootstrap
      vars:
        workload_domain_bootstrap_username: >-
          {{ workload_domain_bootstrap_effective_username }}

        workload_domain_bootstrap_password: >-
          {{ workload_domain_bootstrap_effective_password }}

  post_tasks:

    - name: Validate workload domain bootstrap result
      ansible.builtin.assert:
        that:
          - workload_domain_bootstrap_result is defined
          - workload_domain_bootstrap_result.joined | bool
          - workload_domain_bootstrap_result.validation == 'passed'
          - >-
            workload_domain_bootstrap_result.domain | lower
            ==
            workload_domain_bootstrap_domain_name | lower
        fail_msg: >-
          Workload domain bootstrap completed without a valid membership result.

    - name: Publish workload domain bootstrap artifacts
      ansible.builtin.set_stats:
        data:
          workload_domain_bootstrap_workload_key: >-
            {{ workload_domain_bootstrap_logical_key }}

          workload_domain_bootstrap_platform: >-
            {{ workload_domain_bootstrap_result.platform }}

          workload_domain_bootstrap_domain: >-
            {{ workload_domain_bootstrap_result.domain }}

          workload_domain_bootstrap_status: >-
            {{ workload_domain_bootstrap_result.validation }}

        per_host: true
