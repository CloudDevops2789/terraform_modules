---
- name: Provision AWS Client VPN server certificate
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    terraform_repository_root: "{{ playbook_dir }}/../.."

    terraform_backend_use_lockfile: true
    terraform_backend_encrypt: true

    client_vpn_certificate_easyrsa_ca_s3_key: >-
      client-vpn/easyrsa/pki.tar.gz

  pre_tasks:
    - name: Validate Client VPN certificate provisioning request
      ansible.builtin.assert:
        that:
          - client_vpn_certificate_dns_name | default('' ) | length > 0
          - terraform_environment | default('' ) == 'sandbox'
          - terraform_backend_bucket | default('' ) | length > 2
          - terraform_backend_region | default('' ) | length > 0
          - assume_role_role_arn | default('' ) | length > 0
          - assume_role_aws_region | default('' ) | length > 0
        fail_msg: >-
          Supply certificate provider, certificate domain name, backend inputs,
          and approved AssumeRole inputs.

    - name: Assume IRE AWS deployment role
      ansible.builtin.include_role:
        name: ire_platform.aws.assume_role

    - name: Derive Persistent Terraform paths
      ansible.builtin.set_fact:
        client_vpn_certificate_persistent_root: >-
          {{ terraform_repository_root }}/terraform/stacks/persistent
        client_vpn_certificate_persistent_backend_key: >-
          ire/{{ terraform_environment }}/persistent/terraform.tfstate
      when:
        - client_vpn_certificate_provider | default('') == 'easyrsa'
        - client_vpn_certificate_easyrsa_ca_source | default('filesystem') == 's3'

    - name: Initialize Persistent Terraform backend
      ansible.builtin.command:
        argv:
          - terraform
          - init
          - -input=false
          - -reconfigure
          - "-backend-config=bucket={{ terraform_backend_bucket }}"
          - "-backend-config=key={{ client_vpn_certificate_persistent_backend_key }}"
          - "-backend-config=region={{ terraform_backend_region }}"
          - "-backend-config=encrypt={{ terraform_backend_encrypt | lower }}"
          - "-backend-config=use_lockfile={{ terraform_backend_use_lockfile | lower }}"
      args:
        chdir: "{{ client_vpn_certificate_persistent_root }}"
      environment:
        AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
        AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
        AWS_REGION: "{{ assume_role_aws_auth.region }}"
        AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
        TF_IN_AUTOMATION: "true"
      changed_when: false
      no_log: true
      when:
        - client_vpn_certificate_provider | default('') == 'easyrsa'
        - client_vpn_certificate_easyrsa_ca_source | default('filesystem') == 's3'

    - name: Read Client VPN PKI bucket from Persistent state
      ansible.builtin.command:
        argv:
          - terraform
          - output
          - -raw
          - client_vpn_pki_bucket_name
      args:
        chdir: "{{ client_vpn_certificate_persistent_root }}"
      environment:
        AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
        AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
        AWS_REGION: "{{ assume_role_aws_auth.region }}"
        AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
        TF_IN_AUTOMATION: "true"
      register: client_vpn_certificate_pki_bucket_read
      changed_when: false
      when:
        - client_vpn_certificate_provider | default('') == 'easyrsa'
        - client_vpn_certificate_easyrsa_ca_source | default('filesystem') == 's3'

    - name: Read Client VPN PKI KMS key from Persistent state
      ansible.builtin.command:
        argv:
          - terraform
          - output
          - -raw
          - client_vpn_pki_kms_key_arn
      args:
        chdir: "{{ client_vpn_certificate_persistent_root }}"
      environment:
        AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
        AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
        AWS_REGION: "{{ assume_role_aws_auth.region }}"
        AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
        TF_IN_AUTOMATION: "true"
      register: client_vpn_certificate_pki_kms_read
      changed_when: false
      when:
        - client_vpn_certificate_provider | default('') == 'easyrsa'
        - client_vpn_certificate_easyrsa_ca_source | default('filesystem') == 's3'

    - name: Publish Persistent PKI storage inputs
      ansible.builtin.set_fact:
        client_vpn_certificate_easyrsa_ca_s3_bucket: >-
          {{ client_vpn_certificate_pki_bucket_read.stdout | trim }}
        client_vpn_certificate_easyrsa_ca_kms_key_arn: >-
          {{ client_vpn_certificate_pki_kms_read.stdout | trim }}
      when:
        - client_vpn_certificate_provider | default('') == 'easyrsa'
        - client_vpn_certificate_easyrsa_ca_source | default('filesystem') == 's3'

    - name: Validate Persistent PKI storage contract
      ansible.builtin.assert:
        that:
          - client_vpn_certificate_easyrsa_ca_s3_bucket | length > 0
          - >-
            client_vpn_certificate_easyrsa_ca_kms_key_arn
            is match('^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/.+$')
        fail_msg: >-
          Persistent stack does not expose the Client VPN PKI S3 bucket
          and KMS key required by EasyRSA certificate provisioning.
      when:
        - client_vpn_certificate_provider | default('') == 'easyrsa'
        - client_vpn_certificate_easyrsa_ca_source | default('filesystem') == 's3'

  tasks:
    - name: Provision Client VPN server certificate
      ansible.builtin.include_role:
        name: ire_platform.aws.client_vpn_certificate
        apply:
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
      vars:
        client_vpn_certificate_region: "{{ assume_role_aws_auth.region }}"

    - name: Validate provisioned Client VPN certificate
      ansible.builtin.include_role:
        name: ire_platform.aws.client_vpn_certificate_validate
        apply:
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
      vars:
        client_vpn_certificate_validate_arn: >-
          {{ client_vpn_certificate_provision_result.certificate_arn }}
        client_vpn_certificate_validate_region: >-
          {{ assume_role_aws_auth.region }}

  post_tasks:
    - name: Publish Client VPN certificate workflow artifact
      ansible.builtin.set_stats:
        data:
          server_certificate_arn: >-
            {{ client_vpn_certificate_provision_result.certificate_arn }}
        per_host: false

    - name: Publish EasyRSA Client VPN root certificate workflow artifact
      ansible.builtin.set_stats:
        data:
          client_root_certificate_chain_arn: >-
            {{ client_vpn_certificate_provision_result.certificate_arn }}
        per_host: false
      when:
        - client_vpn_certificate_provision_result.provider == 'easyrsa'

    - name: Report provisioned Client VPN certificate
      ansible.builtin.debug:
        msg:
          - >-
            Provider:
            {{ client_vpn_certificate_provision_result.provider }}
          - >-
            Certificate:
            {{ client_vpn_certificate_provision_result.certificate_arn }}
          - >-
            Domain:
            {{ client_vpn_certificate_provision_result.domain_name }}
