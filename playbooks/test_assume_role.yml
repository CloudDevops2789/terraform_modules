---
- name: Test AWS AssumeRole
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Validate AssumeRole test inputs
      ansible.builtin.assert:
        that:
          - assume_role_role_arn | default('') | length > 0
          - assume_role_aws_region | default('') | length > 0
        fail_msg: >-
          assume_role_role_arn and assume_role_aws_region must be
          supplied by the calling AAP job or operator.

  roles:
    - ire_platform.aws.assume_role
