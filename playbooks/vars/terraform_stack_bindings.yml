---
################################################################################
# Terraform Stack Execution Bindings
################################################################################

terraform_allowed_environments:
  - sandbox

# All lifecycle stacks use the normal contract-brokered deployment workflow.
terraform_active_stacks:
  - foundation
  - platform
  - identity
  - recovery

################################################################################
# Git-controlled variable files
################################################################################

terraform_stack_var_files:
  foundation:
    - common-tags.tfvars
    - foundation.tfvars

  platform:
    - common-tags.tfvars
    - platform.tfvars
    - platform-network-policy.tfvars

  identity:
    - common-tags.tfvars
    - identity.tfvars

  recovery:
    - common-tags.tfvars
    - recovery.tfvars

################################################################################
# Operator/runtime inputs
################################################################################
# Cross-stack contracts are NOT operator inputs.
# AAP resolves them internally from approved upstream Terraform outputs.

terraform_sandbox_runtime_variable_allowlists:
  foundation:
    - kms_key_administrators

  platform:
    - server_certificate_arn
    - root_certificate_chain_arn
    - saml_provider_arn
    - ssm_instance_profile_name

  identity: []

  recovery:
    - demo_ec2_enabled
    - ami_id

################################################################################
# Approved lifecycle dependencies and output contracts
################################################################################
#
# This describes STACK dependencies only.
# It contains no VPC, subnet, security-group, workload, or topology knowledge.

terraform_stack_dependency_outputs:
  platform:
    foundation:
      - network_firewall_logging_kms_key_arn

  identity:
    platform:
      - platform_contract

  recovery:
    foundation:
      - standard_backup_vault_name
      - air_gapped_backup_vault_arn

    platform:
      - platform_contract

################################################################################
# Dependency remote-state locations
################################################################################
# Each dependency resolves from its lifecycle-separated backend key.

terraform_dependency_backend_keys:
  sandbox:
    foundation: "ire/sandbox/foundation/terraform.tfstate"
    platform: "ire/sandbox/platform/terraform.tfstate"
