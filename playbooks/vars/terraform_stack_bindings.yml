---
################################################################################
# Terraform Stack Execution Bindings
################################################################################

terraform_allowed_environments:
  - sandbox

# Persistent contract source is supplied by the approved environment inventory.
# managed  -> read outputs from the persistent Terraform state.
# external -> use the explicit external resource contract below.
#
# Do not define defaults here. vars_files have higher precedence than inventory
# variables and would prevent the SCM inventory from selecting the contract.

# All lifecycle stacks use the normal contract-brokered deployment workflow.
terraform_active_stacks:
  - persistent
  - platform
  - identity
  - recovery

################################################################################
# Git-controlled variable files
################################################################################

terraform_stack_var_files:
  persistent:
    - common-tags.tfvars
    - persistent.tfvars

  platform:
    - common-tags.tfvars
    - platform.tfvars
    - platform-network-policy.tfvars

  identity:
    - common-tags.tfvars
    - identity.tfvars

  recovery:
    - common-tags.tfvars
    - recovery.tfvars

################################################################################
# Operator/runtime inputs
################################################################################
# Cross-stack contracts are not Terraform operator inputs.
# AAP resolves them from approved managed outputs or explicit external bindings.

terraform_sandbox_runtime_variable_allowlists:
  persistent:
    - kms_key_administrators

  platform:
    - server_certificate_arn
    - root_certificate_chain_arn
    - saml_provider_arn
    - ssm_instance_profile_name

  identity: []

  recovery:
    - demo_ec2_enabled
    - ami_id

################################################################################
# Approved lifecycle dependencies and output contracts
################################################################################
# This describes stack dependencies only and contains no topology knowledge.

terraform_stack_dependency_outputs:
  platform:
    persistent:
      - network_firewall_logging_kms_key_arn

  identity:
    platform:
      - platform_contract

  recovery:
    persistent:
      - standard_backup_vault_name
      - air_gapped_backup_vault_arn

    platform:
      - platform_contract

################################################################################
# Dependency remote-state locations
################################################################################

terraform_dependency_backend_keys:
  sandbox:
    persistent: "ire/sandbox/persistent/terraform.tfstate"
    platform: "ire/sandbox/platform/terraform.tfstate"
