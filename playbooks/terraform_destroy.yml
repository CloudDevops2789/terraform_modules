---
- name: Destroy Terraform infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/terraform_stack_bindings.yml

  vars:
    terraform_stack: ""

    terraform_backend_use_lockfile: true
    terraform_backend_encrypt: true

    # Destroy always defaults to plan-only.
    terraform_destroy_enabled: false
    terraform_destroy_confirmation: ""

    # Elevated lifecycle-stack destruction controls.
    terraform_allow_persistent_destroy: false
    terraform_allow_platform_destroy: false
    terraform_allow_identity_destroy: false
    terraform_allow_recovery_destroy: false

  pre_tasks:
    - name: Validate Terraform destroy inputs
      ansible.builtin.assert:
        that:
          - assume_role_role_arn | default('') | length > 0
          - assume_role_aws_region | default('') | length > 0

          - terraform_environment | default('') | length > 0
          - terraform_environment in terraform_allowed_environments

          - terraform_stack | default('') | length > 0
          - terraform_stack in terraform_active_stacks
          - terraform_stack_var_files[terraform_stack] is defined

          - terraform_backend_bucket | default('') | length > 2
          - terraform_backend_region | default('') | length > 0

          - >-
            terraform_persistent_contract_source
            | default('')
            in ['managed', 'external']
          - terraform_external_persistent_resources is defined
          - terraform_external_persistent_resources is mapping

          - terraform_variables is defined
          - terraform_variables is mapping

          - terraform_backend_key is not defined
          - terraform_root is not defined

        fail_msg: >-
          Required Terraform destroy inputs are missing or invalid.
          Supply an approved terraform_environment, terraform_stack,
          AssumeRole configuration, backend bucket/Region, and
          terraform_variables. terraform_backend_key and terraform_root
          are derived internally and must not be supplied.

    - name: Validate lifecycle-stack destroy authorization
      ansible.builtin.assert:
        that:
          - >-
            not (terraform_destroy_enabled | bool)
            or
            (
              terraform_stack == 'recovery'
              and (terraform_allow_recovery_destroy | bool)
              and terraform_destroy_confirmation == 'DESTROY RECOVERY'
            )
            or
            (
              terraform_stack == 'persistent'
              and (terraform_allow_persistent_destroy | bool)
              and terraform_destroy_confirmation == 'DESTROY PERSISTENT'
            )
            or
            (
              terraform_stack == 'platform'
              and (terraform_allow_platform_destroy | bool)
              and terraform_destroy_confirmation == 'DESTROY PLATFORM'
            )
            or
            (
              terraform_stack == 'identity'
              and (terraform_allow_identity_destroy | bool)
              and terraform_destroy_confirmation == 'DESTROY IDENTITY'
            )
        fail_msg: >-
          Destruction was enabled without the authorization required for the
          selected lifecycle stack. Persistent Resources requires
          terraform_allow_persistent_destroy=true and DESTROY PERSISTENT.
          Recovery requires terraform_allow_recovery_destroy=true and
          DESTROY RECOVERY. Platform
          requires terraform_allow_platform_destroy=true and DESTROY PLATFORM.
          Identity requires terraform_allow_identity_destroy=true and
          DESTROY IDENTITY.

    - name: Enforce Sandbox stack runtime variable allowlist
      ansible.builtin.assert:
        that:
          - >-
            terraform_environment != 'sandbox'
            or (
              terraform_variables.keys()
              | list
              | difference(
                  terraform_sandbox_runtime_variable_allowlists[terraform_stack]
                )
              | length
            ) == 0
        fail_msg: >-
          Sandbox AAP runtime variables contain values not approved for the
          selected lifecycle stack. Stable architecture and security settings
          must remain Git controlled.

    - name: Derive Terraform execution binding
      ansible.builtin.set_fact:
        terraform_effective_root: >-
          {{ playbook_dir }}/../terraform/stacks/{{ terraform_stack }}
        terraform_effective_environment_config_root: >-
          {{ playbook_dir }}/../terraform/environments/{{ terraform_environment }}/config
        terraform_effective_backend_key: >-
          ire/{{ terraform_environment }}/{{ terraform_stack }}/terraform.tfstate

    - name: Check Terraform stack root
      ansible.builtin.stat:
        path: "{{ terraform_effective_root }}"
      register: terraform_root_stat

    - name: Validate Terraform stack root
      ansible.builtin.assert:
        that:
          - terraform_root_stat.stat.exists
          - terraform_root_stat.stat.isdir
        fail_msg: >-
          Terraform lifecycle stack root does not exist:
          {{ terraform_effective_root }}

    - name: Check environment stack configuration directory
      ansible.builtin.stat:
        path: "{{ terraform_effective_environment_config_root }}"
      register: terraform_environment_config_stat

    - name: Validate environment stack configuration directory
      ansible.builtin.assert:
        that:
          - terraform_environment_config_stat.stat.exists
          - terraform_environment_config_stat.stat.isdir
        fail_msg: >-
          Terraform environment stack configuration directory does not exist:
          {{ terraform_effective_environment_config_root }}

    - name: Check required Git-controlled Terraform variable files
      ansible.builtin.stat:
        path: "{{ terraform_effective_environment_config_root }}/{{ item }}"
      loop: "{{ terraform_stack_var_files[terraform_stack] }}"
      register: terraform_git_var_file_stats

    - name: Validate required Git-controlled Terraform variable files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: >-
          Required Git-controlled Terraform variable file does not exist:
          {{ item.item }}
      loop: "{{ terraform_git_var_file_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Initialize Terraform Git variable-file argument list
      ansible.builtin.set_fact:
        terraform_git_var_file_args: []

    - name: Build Terraform Git variable-file arguments
      ansible.builtin.set_fact:
        terraform_git_var_file_args: >-
          {{
            terraform_git_var_file_args
            +
            [
              '-var-file='
              ~ terraform_effective_environment_config_root
              ~ '/'
              ~ item
            ]
          }}
      loop: "{{ terraform_stack_var_files[terraform_stack] }}"

    - name: Report derived Terraform destroy binding
      ansible.builtin.debug:
        msg:
          - "Environment: {{ terraform_environment }}"
          - "Stack: {{ terraform_stack }}"
          - "Terraform root: {{ terraform_effective_root }}"
          - "Backend key: {{ terraform_effective_backend_key }}"
          - "Git variable files: {{ terraform_stack_var_files[terraform_stack] }}"

  roles:
    - role: ire_platform.aws.assume_role

  tasks:
    - name: Create temporary Terraform workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: ire-terraform-destroy-
      register: terraform_temp_dir

    - name: Execute Terraform destroy workflow
      block:
        - name: Resolve approved Terraform lifecycle contracts
          ansible.builtin.include_tasks:
            file: tasks/terraform_resolve_contracts.yml

        - name: Resolve approved Terraform sensitive variables
          ansible.builtin.include_tasks:
            file: tasks/terraform_resolve_sensitive_variables.yml

        - name: Build effective Terraform runtime variables
          ansible.builtin.set_fact:
            terraform_effective_variables: >-
              {{
                terraform_variables
                | combine(
                    terraform_contract_variables | default({}),
                    recursive=true
                  )
                | combine(
                    terraform_sensitive_variables | default({}),
                    recursive=true
                  )
                | combine(
                    dict(aws_region=assume_role_aws_region)
                  )
              }}
          no_log: true

        - name: Write temporary Terraform runtime variable file
          ansible.builtin.copy:
            content: "{{ terraform_effective_variables | to_nice_json }}"
            dest: "{{ terraform_temp_dir.path }}/terraform.auto.tfvars.json"
            mode: "0600"
          no_log: true

        - name: Initialize Terraform
          ansible.builtin.command:
            argv:
              - terraform
              - init
              - -input=false
              - -reconfigure
              - "-backend-config=bucket={{ terraform_backend_bucket }}"
              - "-backend-config=key={{ terraform_effective_backend_key }}"
              - "-backend-config=region={{ terraform_backend_region }}"
              - "-backend-config=encrypt={{ terraform_backend_encrypt | lower }}"
              - "-backend-config=use_lockfile={{ terraform_backend_use_lockfile | lower }}"
          args:
            chdir: "{{ terraform_effective_root }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
            TF_IN_AUTOMATION: "true"
          changed_when: false
          no_log: true

        - name: Validate Terraform configuration
          ansible.builtin.command:
            argv:
              - terraform
              - validate
          args:
            chdir: "{{ terraform_effective_root }}"
          environment:
            TF_IN_AUTOMATION: "true"
          changed_when: false

        - name: Create Terraform destroy plan
          ansible.builtin.command:
            argv: >-
              {{
                [
                  'terraform',
                  'plan',
                  '-destroy',
                  '-no-color',
                  '-input=false',
                  '-lock=true',
                  '-detailed-exitcode'
                ]
                + terraform_git_var_file_args
                + [
                  '-var-file='
                  ~ terraform_temp_dir.path
                  ~ '/terraform.auto.tfvars.json',
                  '-out='
                  ~ terraform_temp_dir.path
                  ~ '/destroy.tfplan'
                ]
              }}
          args:
            chdir: "{{ terraform_effective_root }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
            TF_IN_AUTOMATION: "true"
          register: terraform_destroy_plan
          failed_when: terraform_destroy_plan.rc not in [0, 2]
          changed_when: terraform_destroy_plan.rc == 2

        - name: Display Terraform destroy plan summary
          ansible.builtin.debug:
            msg: >-
              {{
                (
                  terraform_destroy_plan.stdout_lines
                  | select('search', '^(Plan:|No changes\\.)')
                  | list
                  | first
                )
                | default(
                    'Terraform destroy plan completed; '
                    ~ 'no summary line was detected.'
                  )
              }}

        - name: Apply Terraform destroy plan
          ansible.builtin.command:
            argv:
              - terraform
              - apply
              - -input=false
              - "{{ terraform_temp_dir.path }}/destroy.tfplan"
          args:
            chdir: "{{ terraform_effective_root }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
            TF_IN_AUTOMATION: "true"
          when:
            - terraform_destroy_plan.rc == 2
            - terraform_destroy_enabled | bool
          changed_when: true

        - name: Report Terraform destroy result
          ansible.builtin.debug:
            msg: >-
              {% if terraform_destroy_plan.rc == 0 %}
              Terraform {{ terraform_environment }}/{{ terraform_stack }}
              state contains no infrastructure requiring destruction.
              {% elif terraform_destroy_enabled | bool %}
              Terraform {{ terraform_environment }}/{{ terraform_stack }}
              infrastructure destroyed successfully.
              {% else %}
              Terraform {{ terraform_environment }}/{{ terraform_stack }}
              destroy plan completed successfully. Destruction was not enabled.
              {% endif %}

      always:
        - name: Remove temporary Terraform workspace
          ansible.builtin.file:
            path: "{{ terraform_temp_dir.path }}"
            state: absent
          when:
            - terraform_temp_dir.path is defined
