---
- name: Destroy Terraform infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    terraform_environment: "sandbox"

    terraform_root: >-
      {{ playbook_dir }}/../terraform/environments/{{ terraform_environment }}

    terraform_backend_use_lockfile: true
    terraform_backend_encrypt: true

    # Sandbox AAP is an execution interface, not an architecture editor.
    # Stable architecture and security settings remain Git controlled.
    terraform_sandbox_runtime_variable_allowlist:
      - demo_ec2_enabled
      - ami_id
      - server_certificate_arn
      - root_certificate_chain_arn
      - saml_provider_arn
      - ssm_instance_profile_name
      - foundation_resources


    # Destroy is plan-only unless explicitly enabled.
    terraform_destroy_enabled: false

    # Required when terraform_destroy_enabled is true.
    terraform_destroy_confirmation: ""

    # Break-glass protection for the persistent Foundation environment.
    # Foundation destroy remains blocked unless this is explicitly enabled.
    terraform_allow_foundation_destroy: false

  pre_tasks:
    - name: Validate Terraform destroy inputs
      ansible.builtin.assert:
        that:
          - assume_role_role_arn | default('') | length > 0
          - assume_role_aws_region | default('') | length > 0

          - terraform_environment | length > 0
          - terraform_environment is match('^[A-Za-z0-9._-]+$')
          - terraform_backend_bucket | default('') | length > 2
          - terraform_backend_key | default('') | length > 0
          - terraform_backend_region | default('') | length > 0

          - terraform_variables is defined
          - terraform_variables is mapping

        fail_msg: >-
          Required Terraform destroy inputs are missing or invalid.
          Supply the AssumeRole configuration, backend configuration,
          terraform_variables, and any environment-specific required inputs
          through AAP or extra vars.

    - name: Protect persistent Foundation from accidental destroy
      ansible.builtin.assert:
        that:
          - >-
            terraform_environment != 'foundation'
            or (terraform_allow_foundation_destroy | bool)
        fail_msg: >-
          Foundation destroy is blocked by default. Set
          terraform_allow_foundation_destroy=true only for an explicitly
          approved Foundation cleanup.

    - name: Validate Terraform destroy authorization
      ansible.builtin.assert:
        that:
          - >-
            not (terraform_destroy_enabled | bool)
            or (
              (
                terraform_environment == 'foundation'
                and (terraform_allow_foundation_destroy | bool)
                and terraform_destroy_confirmation == 'DESTROY FOUNDATION'
              )
              or (
                terraform_environment != 'foundation'
                and terraform_destroy_confirmation == 'DESTROY'
              )
            )
        fail_msg: >-
          Destruction was enabled without the required explicit confirmation.
          Use DESTROY for recovery environments. Foundation additionally
          requires terraform_allow_foundation_destroy=true and the exact
          confirmation DESTROY FOUNDATION.

    - name: Enforce Sandbox Terraform runtime variable allowlist
      ansible.builtin.assert:
        that:
          - >-
            terraform_environment != 'sandbox'
            or (
              terraform_variables.keys()
              | list
              | difference(terraform_sandbox_runtime_variable_allowlist)
              | length
            ) == 0
        fail_msg: >-
          Sandbox AAP runtime variables contain Git-controlled architecture
          settings. Only approved runtime and external-binding variables may
          be supplied through AAP.

    - name: Check Terraform root
      ansible.builtin.stat:
        path: "{{ terraform_root }}"
      register: terraform_root_stat

    - name: Validate Terraform root
      ansible.builtin.assert:
        that:
          - terraform_root_stat.stat.exists
          - terraform_root_stat.stat.isdir
        fail_msg: >-
          Terraform root does not exist: {{ terraform_root }}

  roles:
    - role: ire_platform.aws.assume_role

  tasks:
    - name: Create temporary Terraform workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: ire-terraform-destroy-
      register: terraform_temp_dir

    - name: Execute Terraform destroy workflow
      block:
        - name: Build effective Terraform runtime variables
          ansible.builtin.set_fact:
            terraform_effective_variables: >-
              {{
                terraform_variables
                | combine(
                    {
                      'aws_region': assume_role_aws_region
                    }
                  )
              }}
          no_log: true

        - name: Write temporary Terraform variable file
          ansible.builtin.copy:
            content: "{{ terraform_effective_variables | to_nice_json }}"
            dest: "{{ terraform_temp_dir.path }}/terraform.auto.tfvars.json"
            mode: "0600"
          no_log: true

        - name: Initialize Terraform
          ansible.builtin.command:
            argv:
              - terraform
              - init
              - -input=false
              - -reconfigure
              - "-backend-config=bucket={{ terraform_backend_bucket }}"
              - "-backend-config=key={{ terraform_backend_key }}"
              - "-backend-config=region={{ terraform_backend_region }}"
              - "-backend-config=encrypt={{ terraform_backend_encrypt | lower }}"
              - "-backend-config=use_lockfile={{ terraform_backend_use_lockfile | lower }}"
          args:
            chdir: "{{ terraform_root }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
            TF_IN_AUTOMATION: "true"
          changed_when: false
          no_log: true

        - name: Validate Terraform configuration
          ansible.builtin.command:
            argv:
              - terraform
              - validate
          args:
            chdir: "{{ terraform_root }}"
          environment:
            TF_IN_AUTOMATION: "true"
          changed_when: false

        - name: Create Terraform destroy plan
          ansible.builtin.command:
            argv:
              - terraform
              - plan
              - -destroy
              - -no-color
              - -input=false
              - -lock=true
              - -detailed-exitcode
              - "-var-file={{ terraform_temp_dir.path }}/terraform.auto.tfvars.json"
              - "-out={{ terraform_temp_dir.path }}/destroy.tfplan"
          args:
            chdir: "{{ terraform_root }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
            TF_IN_AUTOMATION: "true"
          register: terraform_destroy_plan
          failed_when: terraform_destroy_plan.rc not in [0, 2]
          changed_when: terraform_destroy_plan.rc == 2

        - name: Display Terraform destroy plan summary
          ansible.builtin.debug:
            msg: >-
              {{
                (
                  terraform_destroy_plan.stdout_lines
                  | select('search', '^(Plan:|No changes\\.)')
                  | list
                  | first
                )
                | default(
                    'Terraform destroy plan completed; '
                    ~ 'no summary line was detected.'
                  )
              }}

        - name: Apply Terraform destroy plan
          ansible.builtin.command:
            argv:
              - terraform
              - apply
              - -input=false
              - "{{ terraform_temp_dir.path }}/destroy.tfplan"
          args:
            chdir: "{{ terraform_root }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ assume_role_aws_auth.access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ assume_role_aws_auth.secret_key }}"
            AWS_SESSION_TOKEN: "{{ assume_role_aws_auth.session_token }}"
            AWS_REGION: "{{ assume_role_aws_auth.region }}"
            AWS_DEFAULT_REGION: "{{ assume_role_aws_auth.region }}"
            TF_IN_AUTOMATION: "true"
          when:
            - terraform_destroy_plan.rc == 2
            - terraform_destroy_enabled | bool
            - terraform_destroy_confirmation == "DESTROY"
          changed_when: true

        - name: Report Terraform destroy result
          ansible.builtin.debug:
            msg: >-
              {% if terraform_destroy_plan.rc == 0 %}
              Terraform state contains no infrastructure requiring destruction.
              {% elif terraform_destroy_enabled | bool %}
              Terraform infrastructure destroyed successfully.
              {% else %}
              Terraform destroy plan completed successfully.
              Destruction was not enabled.
              {% endif %}

      always:
        - name: Remove temporary Terraform workspace
          ansible.builtin.file:
            path: "{{ terraform_temp_dir.path }}"
            state: absent
          when:
            - terraform_temp_dir.path is defined
