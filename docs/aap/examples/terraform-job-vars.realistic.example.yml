---
################################################################################
# Remote Access Apply JT With Directory Authentication Runtime Bindings
################################################################################
terraform_stack: "remote-access"
terraform_apply_enabled: true

# Git controls Remote Access enablement and authentication type.
# The Managed AD bootstrap workflow publishes the authorization-group SID.
# The JT supplies only the remaining approved external bindings.
terraform_variables:
  server_certificate_arn: "<APPROVED_SERVER_CERTIFICATE_ARN>"
