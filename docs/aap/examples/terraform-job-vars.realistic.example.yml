---
################################################################################
# Platform Apply JT With Certificate Authentication Runtime Bindings
################################################################################
terraform_stack: "platform"
terraform_apply_enabled: true

# Git controls client_vpn_enabled and authentication_type. The JT supplies only
# the approved external certificate references required by that configuration.
terraform_variables:
  server_certificate_arn: "<APPROVED_SERVER_CERTIFICATE_ARN>"
  root_certificate_chain_arn: "<APPROVED_ROOT_CA_CERTIFICATE_ARN>"
