---
################################################################################
# Remote Access Apply JT With Directory Authentication Runtime Bindings
################################################################################
terraform_stack: "remote-access"
terraform_apply_enabled: true

# Git controls Remote Access enablement and authentication type. The JT supplies
# only the approved external identifiers required by that configuration.
terraform_variables:
  client_vpn_access_group_id: "<MANAGED_AD_VPN_GROUP_SID>"
  server_certificate_arn: "<APPROVED_SERVER_CERTIFICATE_ARN>"
