################################################################################
# Minimal Terraform AAP Job Template Variables
################################################################################
terraform_stack: "platform"
terraform_apply_enabled: false

# Allowlisted stack-specific runtime bindings only.
terraform_variables: {}

# Example exercise:
#
# For Recovery, use a fixed Recovery JT and replace the empty map with:
#
# terraform_variables:
#   demo_ec2_enabled: true
#
# Recovery AMIs, access methods, and optional SSH key-pair references are
# reviewed in terraform/environments/sandbox/stacks/recovery.tfvars.
